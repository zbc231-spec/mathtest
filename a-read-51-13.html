    c: "        唐三藏師徒四人，歷經千辛萬苦，終於來到如來佛祖所在處的靈山。那靈山霞光普照、瑞氣呈祥，但上山的途中卻遇到一條河。\n        唐三藏正在發愁如何渡過，河面上飄來一葉扁舟，渡船的人過來迎接他們。\n        唐三藏看到那船底，立刻大叫起來：「這是個無底船啊！」\n        「師父莫怕，快上去吧！」孫悟空說著，用力一推，把唐三藏推上了船。奇怪，那船雖然無底，唐三藏還是能站得穩穩的。\n        這時，只見一具屍體從水中飄過，唐三藏怕極了。撐船的人笑道：「那具屍體是原來的你，現在你已經脫胎換骨了。」\n        無底船靠岸後，師徒四人走進了如來佛祖所在的雷音寺，如來佛祖知道他們的來意，讓兩個尊者帶他們去領經書。\n        尊者離開大殿，對他們說：「這經書不是白給的，你要拿禮物來換。」\n        唐三藏為難的說：「弟子路途遙遠，未能準備禮物。」\n        那兩個尊者沒再說什麼，給了他們一些經書，師徒四人裝好經書往回走。忽然一陣狂風吹了過來，經書被吹得七零八落。孫悟空抓住一本，發現竟然是無字天書。\n        孫悟空大怒，返回雷音寺，見到如來佛祖大喊：「我們辛辛苦苦才到這裡，為什麼給我們無字天書？」\n        如來佛祖說道：「經不可輕傳，也不可空取。」然後，仍舊讓兩位尊者給他們取經書。\n        尊者離開前，又再度問了一次：「這次可有禮物？」\n        唐三藏翻遍包袱，最後只得把大唐皇帝送給他的紫金缽盂送給尊者。\n        這一回，總算得到有字的經書。師徒四人正要離去，八大金剛駕雲而來，說是來送他們回大唐的呢！\n        唐三藏說：「可是我無法騰雲駕霧呢！」\n        「你就上來試試看吧！」八大金剛笑說。\n        唐三藏已褪去凡胎肉體，竟然能夠輕輕飄飄的踏上白雲。\n        就在這時候，觀音菩薩掐指一算，唐三藏師徒四人還少一難，才足九九八十一難，於是，她讓八大金剛把師徒四人丟了下去，正好落在通天河裡。\n        豬八戒嚷了起來說：「這八大金剛真不夠意思，要送也不送到底！」\n        這時，有人在水底高喊：「聖僧！聖僧！快上我的背。」\n        四人見到是先前載他們過河的那一隻老黿，都高興極了。老黿再一次馱著師徒四人，往岸邊前去。\n        到了河中央，老黿轉頭問道：「聖僧，你到佛祖面前，問過我的壽命還剩多少啊？」\n        唐三藏一驚，這一路上他滿腦子都是取經，真的忘記此事了。如今老黿發問，他不知如何是好？\n        老黿等了一會兒，不見回答，就知道唐三藏把他的問題給忘了，一生氣，翻個身，把師徒四人都丟到河裡。\n        孫悟空師兄弟忙好一陣子，總算把師父跟經書都救上岸，可惜經書都溼透，師徒四人只得把經書攤開來晒。\n        經書晒得差不多的時候，八大金剛又出現了，唐三藏師徒四人重新接上雲頭，這次可平安送回東土大唐。\n        唐太宗遠遠的看到唐三藏歸來，高興極了，出城迎接。唐三藏把帶回來的五千零四十八卷經書全交給唐太宗，唐太宗命人將這些經書收放在大雁塔。\n        幾日後，唐三藏正要講經，忽然空中香風陣陣，原來是八大金剛來接他們回去西方。\n        師徒四人回到靈山，如來佛祖賜封唐三藏為旃檀功德佛，孫悟空為鬥戰勝佛，封豬八戒為淨壇使者，封沙悟淨為金身羅漢，封白龍馬為八部天龍廣力菩薩。\n        至此，唐三藏師徒四人西行取經的任務，終於圓滿結束了。\n\n--------------------\n【資料來源】：Hami書城-名著好好讀-西遊記",

{
    t: "唐代詩人王維為何被稱作「詩佛」？",
    c: "        王維以擅長寫景詩而著稱於世，成為盛唐時代田園山水詩派的領袖。宋代大文豪蘇軾對王維的評價甚高，稱讚他「詩中有畫，畫中有詩」。所謂「詩中有畫」，就是說王維的詩猶如畫般優美動人；所謂「畫中有詩」，就是說畫中富有詩意，韻味無窮。然而，王維被冠以「詩佛」之名，又是甚麼原因？詩人與佛教又有著何等深厚因緣？\n        縱觀王維的一生，皆是與佛有緣。首先，他是在一個佛教家庭中長大的，母親崔氏是個虔誠的佛教徒，王維自小受她的薰陶感化，影響至深。對於母親事佛的虔誠，王維有文提到：「……故博陵縣君崔氏，師事大照禪師三十餘歲，褐衣蔬食，持戒安禪，樂住山林，志求寂靜。」（王右丞集・卷十七）\n        王維是家中長子，父親很早就去世，由母親撫養長大。母親給他取名「維」，字「摩詰」，別具意思。「維」與「摩詰」連結而成「維摩詰」。眾所周知，「維摩詰」恰是佛經瑰寶《維摩詰所說經》中神通廣大的主人翁，他是佛陀的在家弟子，其梵名為「維摩羅詰」，意譯為「淨名」，乃清淨無垢之意。維摩詰雖身在俗塵，卻精通大乘教義，他並未出家，而以在家居士的形象積極行善、修道，以般若空的思想，實踐六度，利樂眾生，襄助釋迦牟尼弘揚佛法，是大乘佛教在家眾的典範。從其名字可以推斷，王維在呱呱落地之時，其母已寄望他能一生追求佛道，並以維摩詰作為人生修行的目標與榜樣。\n        劉昫在《舊唐書》本傳上說：「維弟兄俱奉佛，居常蔬食，不茹葷血，晚年長齋，不衣文彩。」因為王維篤志信佛，所以他的詩歌創作也在不同程度上受到了佛教思想的影響。在他的田園山水詩中，有許多作品皆蘊含著濃濃的禪意，如「行到水窮處，坐看雲起時」（〈終南別業〉）、「君問窮通理，漁歌入浦深」（〈酬張少府〉）等，哲理與禪趣兼備，千百年來為人所樂道。\n        王維天才橫溢，琴棋書畫無所不通，弱冠之年已考取功名，名動京師，但他的仕途並不如意，屢遭貶謫。三十二歲時，妻子更因難產連同腹中胎兒一同遇難。王維萬分悲痛，辭去官職，決定終生不娶，到嵩山隱居學禪，以求解脫之道。此後，他一個人孤獨地生活了三十年。\n        人生的變故使他的思想發生很大的變化，佛教對他確實也有情感撫慰的作用，使他以無欲無求的淡泊心境對待外物和外在世界。王維也是出名的孝子，侍奉母親，以孝聞名。他曾在藍田輞川購置別業，以供他母親念經修佛。公元七五零年，母親逝世。歷史記載，王維服喪期間，形銷骨立，幾乎沒能活下來。這時的王維已五十多歲，「晚年唯好靜，萬事不關心」（〈酬張少府〉），詩人已不復往日的雄心壯志，對於爭權奪利的日子已感厭煩，於是採取了亦官亦隱的生活模式。\n        晚年的王維歸隱田園，不時與僧人為伍。公元七六一年，王維上書請求朝廷盡削己職。不久病逝，享年六十三歲。\n\n--------------------\n【資料來源】：https://www.buddhistdoor.org/mingkok/唐代詩人王維為何被稱作「詩佛」？/",

    c: "        說到龍捲風，不難想到綠野仙蹤的故事裡，主角桃樂絲便是被龍捲風吹到了遙遠的奧茲國，展開一段奇幻旅程；在中國，也有文字學家猜測「龍」這個字便是古人驚訝於龍捲風強大的威力，而按照龍捲風的形象所創造，並進而成為中國人心目中的神獸。而在台灣，雖然頻率不高，但是每年偶爾仍會見到龍捲風出現的消息。\n        龍捲風是人類所知最具破壞力的自然風暴，其中心的氣壓極低，甚至比颱風還低，因此產生極強烈的氣旋式渦旋。龍捲風的氣流迅速繞著近似垂直的軸心旋轉，風速可達每秒五十至一百公尺（每小時一百八十公里至三百九十六公里）。\n        龍捲風的規模一般只有一百五十公尺寬，寬度達一公里者已經可以稱為龍捲風的「巨無霸」，由於它的範圍極窄，故其破壞路徑往往侷限於一條狹長地帶，同時亦造成在監測上難以直接觀測到龍捲風的發生。\n        基本上，只要符合特定氣象條件，世界各地皆有可能出現龍捲風。根據統計，台灣平均一年龍捲風會出現兩次左右。龍捲風在台灣出沒地點北至台北新店，南至屏東，甚至外島如澎湖、基隆嶼等地都有過龍捲風的紀錄。\n        龍捲風是大氣環境不穩定下的產物，通常出現在冷暖空氣交會的地方，此時由於暖空氣較輕，冷空氣較重，兩者之間容易產生垂直方向的大氣運動，並進一步發展出高聳的對流雲系。\n        高聳的對流雲系便是不穩定大氣最具體的現象，或稱為深對流系統（deep convective cloud），這些直入雲霄的積雲便是龍捲風形成的母雲。以台灣而言，以颮線（squall lines）、颱風與西南氣流為發生龍捲風之大宗。\n        另外一個形成龍捲風的條件是強烈的垂直風切，也就是上下層大氣的風在風向或風速上有很大的變化。這種情況下容易產生旋轉，並將原先水平方向運動的渦管扭轉成垂直，也就是我們所看到的龍捲風。\n        最適合龍捲風的地形是一望無際的平原，山地會破壞大氣的旋轉運動，故山區不易見到龍捲風。在台灣，屏東平原過去便因為地形因素，最常發生龍捲風，而有「龍捲窩」的稱號。\n        龍捲風是大自然災害中最為劇烈的現象之一，擁有強大的破壞力，其影響範圍小、歷時短暫的特性往往讓人措手不及。所幸台灣並非龍捲風好發地區，但每年都會有龍捲風伴隨著梅雨鋒面、颱風而來，故亦不能掉以輕心。\n\n--------------------\n【資料來源】：https://scitechvista.nat.gov.tw/Article/c000009/detail?ID=8a6a97dc-28bd-45b7-940e-6eb0e97713fa ",

        // 冷卻時間設定：1 小時 (以毫秒計算 = 60分 * 60秒 * 1000毫秒)
        const COOLDOWN_TIME = 20 * 60 * 1000;
        let cooldownInterval = null;
        let liveTimerInterval = null; // 即時計時器變數

        // 洗牌演算法
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let db = shuffle(JSON.parse(JSON.stringify(rawDb)));
        db.forEach(article => {
            shuffle(article.q);
            article.q.forEach(question => {
                let formattedOpts = question.opts.map((optText, origIdx) => ({
                    text: optText,
                    isCorrect: origIdx === question.a
                }));
                shuffle(formattedOpts);
                question.shuffledOpts = formattedOpts;
            });
        });

        let idx = 0;
        let totalScore = 0;
        let articleStartTime = null; 
        let articleTimes = [];       

        // 檢查是否處於 1 小時冷卻期
        function checkCooldown() {
            const lastSubmitTime = localStorage.getItem('last_quiz_submit_time');
            if (lastSubmitTime) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastSubmitTime);

                if (timePassed < COOLDOWN_TIME) {
                    showCooldownScreen(COOLDOWN_TIME - timePassed);
                    return true;
                }
            }
            return false;
        }

        // 顯示倒數鎖定畫面
        function showCooldownScreen(remainingTime) {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('cooldown-screen').classList.remove('hidden');

            function updateTimer() {
                remainingTime -= 1000;
                if (remainingTime <= 0) {
                    clearInterval(cooldownInterval);
                    document.getElementById('cooldown-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                    render();
                    return;
                }
                const mins = Math.floor(remainingTime / (1000 * 60));
                const secs = Math.floor((remainingTime % (1000 * 60)) / 1000);
                document.getElementById('cd-timer-text').innerText = `剩餘時間：${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;
            }

            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        function render() {
            if (checkCooldown()) return;

            // 清除前一篇的即時計時器（若存在）
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            const data = db[idx];
            document.getElementById('display-title').innerText = data.t;
            document.getElementById('display-content').innerHTML = data.c;
            
            const list = document.getElementById('quiz-list');
            list.innerHTML = '';
            data.q.forEach((item, i) => {
                let optsHtml = '';
                item.shuffledOpts.forEach((o, oi) => {
                    optsHtml += `<label class="opt-item"><input type="radio" name="q${i}" value="${oi}"> ${o.text}</label>`;
                });
                list.innerHTML += `
                    <div class="q-block">
                        <div class="q-header">${i+1}. ${item.txt} (${item.s}分)</div>
                        ${optsHtml}
                        <div id="fb${i}" class="ans-feedback"></div>
                    </div>`;
            });

            document.getElementById('live-timer-box').classList.remove('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            
            // 重置滾動條頂部位置
            document.getElementById('quiz-scroll-area').scrollTop = 0;
            document.querySelector('.article-pane').scrollTop = 0;

            articleStartTime = new Date();

            // 啟動即時動態計時器 (每秒更新一次)
            const timerText = document.getElementById('live-timer-text');
            function updateLiveTimer() {
                const now = new Date();
                const diffSec = Math.floor((now - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                timerText.innerText = `${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;

                // 超過 3 分鐘 (180 秒) 文字會轉為綠色作為溫馨提示
                if (diffSec >= 180) {
                    timerText.style.color = '#27ae60';
                } else {
                    timerText.style.color = '#e67e22';
                }
            }

            updateLiveTimer();
            liveTimerInterval = setInterval(updateLiveTimer, 1000);
        }

        function checkAll() {
            const data = db[idx];
            let roundScore = 0;

            for(let i=0; i<data.q.length; i++) {
                if(!document.querySelector(`input[name="q${i}"]:checked`)) {
                    alert("第 " + (i+1) + " 題還沒寫喔！"); return;
                }
            }

            // 停止本篇的即時計時器
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            if (articleStartTime) {
                const articleEndTime = new Date();
                const diffSec = Math.floor((articleEndTime - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                const timeStr = `${mins > 0 ? mins + ' 分 ' : ''}${secs} 秒`;
                
                articleTimes[idx] = {
                    title: data.t,
                    time: timeStr
                };
            }

            for(let i=0; i<data.q.length; i++) {
                const userVal = parseInt(document.querySelector(`input[name="q${i}"]:checked`).value);
                const item = data.q[i];
                const selectedOpt = item.shuffledOpts[userVal];
                const correctOpt = item.shuffledOpts.find(o => o.isCorrect);
                const fb = document.getElementById('fb'+i);
                fb.style.display = "block";
                
                if(selectedOpt.isCorrect) {
                    fb.className = "ans-feedback is-correct";
                    fb.innerHTML = `<strong>✅ 答對了！</strong> ${item.fb}`;
                    roundScore += item.s;
                } else {
                    fb.className = "ans-feedback is-wrong";
                    fb.innerHTML = `<strong>❌ 答錯了！</strong> 正確答案是：${correctOpt.text}<br>${item.fb}`;
                }
                document.querySelectorAll(`input[name="q${i}"]`).forEach(el => el.disabled = true);
            }

            totalScore += roundScore;
            document.getElementById('score-val').innerText = totalScore;
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            
            if(idx === db.length - 1) document.getElementById('btn-next').innerText = "查看最後總分";
        }

                // 隱藏題目與文章

        }
