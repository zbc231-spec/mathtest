    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; height: 100vh; background: #2c3e50; overflow: hidden; }

        /* --- 資訊欄 --- */
        #top-panel { 
            height: 15%; background: #ffffff; 
            display: flex; align-items: center; justify-content: space-around; 
            border-bottom: 2px solid #ddd; box-sizing: border-box; padding: 0 20px;
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #2ecc71; object-fit: cover; }
        .stats { font-size: 2.2rem; font-weight: bold; color: #2c3e50; }
        .heart { color: #e74c3c; font-size: 2.2rem; margin: 0 2px; }

        /* --- 主區域：顯示底圖 b-read.jpg --- */
        #main-layout { 
            height: 85%; 
            background: url('b-read.jpg') no-repeat center center; background-size: cover;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }

        /* 雙欄容器：完全無底框效果 */
        .content-card {
            background: transparent;
            width: 95%; height: 95%;
            display: flex; overflow: hidden;
            border: none;
            box-shadow: none;
        }

        /* 自訂隱形捲軸 */
        .article-pane::-webkit-scrollbar, .quiz-scroll-area::-webkit-scrollbar {
            width: 6px;
        }
        .article-pane::-webkit-scrollbar-thumb, .quiz-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
        .article-pane::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 左側文章區 / 結算資訊區 */
        .article-pane {
            width: 50%;
            height: 100%;
            flex: none;
            box-sizing: border-box;
            padding: 40px 60px 40px 100px;     
            overflow-y: auto;
            border-right: none;
        }
        .a-title { font-size: 2rem; color: #27ae60; font-weight: bold; margin-bottom: 20px; border-left: 10px solid #27ae60; padding-left: 15px; }
        .a-text { font-size: 1.35rem; line-height: 2.1; color: #2c3e50; white-space: pre-wrap; }

        /* 右側題目主區域 (垂直佈局：頂部計時器固定，其餘可滾動) */
        .quiz-pane {
            width: 50%;
            height: 100%;
            flex: none;
            box-sizing: border-box; 
            padding: 20px 30px;          
            background: transparent;
            display: flex;
            flex-direction: column;
        }

        #quiz-questions-wrap {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* 頂部固定計時器（不隨卷軸移動） */
.sticky-timer-box {
    flex: none;
    text-align: center;
    margin-bottom: 8px;     /* 稍微縮小下邊距 */
    font-size: 1.2rem;     /* 從 1.3rem 調小成 0.85rem */
    font-weight: bold;    /* 取消粗體 */
    color: #7f8c8d;         /* 改為較淺的灰藍色，不搶眼 */
    background: transparent;/* 去掉明顯的白色背景，或改成簡約風 */
    padding: 4px 8px;       /* 縮小內邊距，節省空間 */
    border: none;           /* 去掉外框 */
    box-shadow: none;       /* 去掉陰影 */
}
        /* 題目滾動區（包含題目與底部的提交按鈕） */
        .quiz-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* 結算頁面使用的「無捲軸」狀態 */
        .no-scroll {
            overflow: hidden !important;
        }

        .q-block { margin-bottom: 25px; background: rgba(255, 255, 255, 0.0); padding: 15px; border-radius: 12px; border: 1px solid #ddd; }
        .q-header { font-size: 1.3rem; font-weight: bold; color: #222222; margin-bottom: 12px; }
        .opt-item { 
            display: block; margin-bottom: 10px; padding: 12px; border: 1px solid #ccc; 
            border-radius: 10px; cursor: pointer; font-size: 1.15rem; background: white;
        }
        .opt-item:hover { background: #fefae0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.3); }

        /* 解析區樣式 */
        .ans-feedback {
            margin-top: 10px; padding: 12px; border-radius: 10px; display: none;
            font-size: 1.1rem; line-height: 1.5; border: 2px solid;
        }
        .is-correct { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
        .is-wrong { background: #ffebee; border-color: #ef5350; color: #b71c1c; }

        .btn-box { text-align: center; padding: 20px 0 30px 0; }
        .btn { 
            padding: 15px 50px; font-size: 1.3rem; cursor: pointer; border-radius: 15px; 
            border: none; color: white; font-weight: bold; transition: 0.2s;
        }
        .btn-submit { background: #3498db; box-shadow: 0 6px #2980b9; }
        .btn-next { background: #2ecc71; box-shadow: 0 6px #27ae60; }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        /* --- 結算頁面樣式 --- */
        .finish-left { color: #2c3e50; text-align: left; padding-top: 10px; }
        .finish-title { font-size: 2.8rem; color: #27ae60; font-weight: bold; margin-bottom: 15px; }

            width: 100%; height: 100%;
            display: flex; flex-direction: column;

        .hidden { display: none !important; }
    </style>

    c: "        在夏天南方的星空中，有一個相當吸引人注目的星座，它呈巨大的 S 型，閃爍著明亮的光芒，那就是天蠍座。\n        天蠍座故事的主人翁是法伊頓，他是太陽神阿波羅與仙女克里美妮的兒子，長得非常俊秀。有一天，有人質疑他不是太陽神的兒子，他非常生氣，便前往巴拿撒斯高山上富麗堂皇的太陽神宮殿，請求父神證明自己的身身世。\n        太陽神對他說：「你的確是我的親生兒子，你要什麼證據我都可以給你。」法伊頓便請求駕駛一次太陽車來證明身分。太陽神大驚失色，連忙勸阻：「太陽車只有我能駕馭，連天帝宙斯也辦不到！拉車的駿馬精力充沛，路途崎嶇險阻，下坡時更易失控。況且一路上還有許多可怕的妖怪！」然而，法伊頓一句也聽不進去，堅持要駕車，太陽神無奈之下只好答應，並為他戴上護帽。\n        黃金與白銀打造的太陽車由幾匹駿馬拉著，一出發便劇烈顛簸並偏離了軌道。太陽車散發的極致熱度讓天空中的星座痛苦不堪。法伊頓緊張得臉色蒼白、兩腿發抖，甚至因為緊張而忘了馬的名字，完全無法控制牠們。駿馬橫衝直撞，所到之處陷入一片火海，高山森林燃燒，河川乾涸變成沙漠。\n        面對這場浩劫，天后赫拉派遣了一隻巨大的毒蠍子前去阻止失控的太陽車。毒蠍子勇敢衝上前，死死咬住法伊頓的腳踝，使其無法繼續駕車。隨後，天帝宙斯發射雷霆擊碎了太陽車，法伊頓如流星般墜落身亡。\n        事後，赫拉的那隻毒蠍子因為立下了阻止浩劫的大功，被放上了天空，成為耀眼燦爛的天蠍座。\n\n--------------------\n【資料來源】：https://angelcity.tw/world/storys.htm",

    t: "元旦最早看到日出的地方",
    c: "        元旦最早看見日出的地方，與高度有關，與經緯度也有關。在臺灣附近的地理位置經緯度，海拔100公尺的日出時刻將比海平面提早約1分半鐘，往東和往南方每100公里將提早4至2分鐘，因此建議可以往地勢高處來奪得日出的先機。不過山區因地形與林相比平地複雜，要在日出方位地平線無遮蔽的狀況下才能於預測時刻直擊精彩的日出。在臺灣，元旦的日出方位約為115度，也就是東南東方附近，也就是說要尋找東南東方無遮蔽，最好能看見海平線的地方，才是最佳的日出觀賞地點。\n        全國最早日出出現在花蓮縣柏南山，不過柏南山海拔高達3,443公尺，抵達不易，若要在臺灣本島平地追元旦日出，最早是在鵝鑾鼻燈塔，離島則為蘭嶼。柏南山雖非台灣最高峰（玉山3952公尺），卻是台灣本島上較為偏南、偏東的山脈之一，因此成為元旦當天台灣最早看見日出的地方。\n        同場加映：全世界最早看到日出的國家\n<img src='x5117-1.jpg' alt='x5117-1.jpg' style='max-width:100%; height:auto; border-radius:8px;'></div>\n        位於太平洋的群島國「吉爾巴斯（Kiribati）」，1999年脫離英國獨立為吉爾巴斯共和國。在其境內的某個位置交集了四個半球，創下一個複雜的紀錄。赤道處中心交集上下的南北半球，而左右一邊領域屬於今天，另一邊領域已經到了明天。這使得它是成了世界上最早迎接日出最晚送走落日的國境。吉爾巴斯有這樣著名的詠頌：「在每一天，迎接地球的第一道曙光，在明天之後，再見失落的地平線。」\n        因為吉爾巴斯的地理位置恰好落在赤道和國際換日線交集之間，所以形成了這樣一個人造的「奇蹟空間」。吉爾巴斯領地是海中的三大群島群，東西跨越數千公里，它主要的吉爾伯特群島在經線180度線以西，而鳳凰群島與萊恩群島則在經線180度線以東。以國際換日線時區而言，同一個吉爾巴斯國的人卻生活在不同的日子——今天和昨天，給社會生活帶來不便。\n        吉里巴斯國內經過努力改換了時區，將經線180度線以東的鳳凰群島、萊恩群島的法定時區，改訂為UTC+13、UTC+14，使其與位於UTC+12時區的吉爾柏特群島同屬一天。目前，屬於吉里巴斯的萊恩群島是全球中唯一使用UTC+14時區的地方，也是地球上人定的一天最早開始的地方。其中的加羅林群島，日出最早，在2000年之千禧年最早迎接第一道曙光，便因此更名為「千禧島」。如果要想過一個暮送舊年夕陽、朝迎新年初日的跨年，到吉爾巴斯是個好選擇，因為它是地球上最早迎接日出，又是最晚送走落日的國度。\n\n--------------------\n【資料來源】：https://tam.gov.taipei/News_Content.aspx?n=EE8B0C19F602864A&sms=52C350C47FE06B81&s=044F53EC24A70E0B、https://www.epochtimes.com/b5/15/12/25/n4604108.htm",

{
    t: "告別「新年新希望垃圾場」！把願望變成做得到的日常習慣",
    c: "        告別「新年新希望垃圾場」！每天 5 分鐘無痛累積，把願望變成做得到的日常習慣\n        每到年底，當我們忙著撰寫企業策略報告的同時，也會習慣性地替自己的生活做一份「年度體檢」，開始設定來年的新目標。然而，大多數的新年新希望往往活不過一、兩個月。如果每放棄一項願望就能得到 1000 元，我（以及許多人）現在大概都是千萬富翁。\n        那麼，為什麼我們每年屢次將目標丟進「新年新希望垃圾場」？成功的目標實踐，不應仰賴意志力，必須從設定、執行到復盤，建立一套「極低門檻」的系統。\n        ◎為什麼新年願望總是撐不久？高頻率目標最容易中斷後放棄\n        許多人失敗的原因在於目標設定得過於高遠，例如「每周運動 3 次」或「每天寫日記」。這種高頻率的目標，設定的時候似乎可以顯示自己的決心，然而「每日」「每周」的頻率一旦中斷，便容易徹底放棄。\n        ◎改變不需要宏大的起手式：降低門檻，讓習慣容易開始\n        若想告別 3 分鐘熱度，目標的起步門檻必須設計得「相當低」。我今年有成功一件事是使用多鄰國（Duolingo） 學韓文，至今已連續執行超過 200 天。回顧起來，這個策略跟《原子習慣》的技巧很契合。\n        多鄰國的每個單元都很短，只要幾分鐘就可以完成，而且以情勒鳥為賣點，它會千方百計提醒你回來簽到打卡，作為語言學習應用程式已經仁至義盡。我做的事情是，把這個習慣堆疊到舊習慣之上，設下了固定 App 使用時間，每天從家裡走到捷運站的這段路，花 5 分鐘完成。\n        只要讓通勤跟玩 App 綁在一起，就不會忘記，周末和假日數次感謝情勒提醒，達成 200 天真的不難。\n        一天幾分鐘或許微不足道，但當你連續 200 天都付出心力在同一件事情上，還是會累積一點小成果。\n <img src='x5117-2.jpg' alt='x5117-2.jpg' style='max-width:100%; height:auto; border-radius:8px;'></div>\n        ◎定期復盤：看自己「已經走了多遠」、「方向是否正確」\n        一旦計畫運行一陣子，維持動力和正確方向則需要復盤，復盤的意義在於定期回頭看，確定「我已經走了多遠」以及「我的方向是否正確」。\n        我曾經進行過飲食控制計畫，因為不想要太複雜，只計算總卡路里。後來經朋友建議，我開始在追蹤目標中新增了追蹤蛋白質攝取量。你決定衡量某件事時，它會改變你做這件事情的方式。\n        因為追蹤蛋白質，我開始更有意識地挑食物，也因此學會辨識更多蛋白質來源，讓整個計畫得以延續與進化。復盤讓計畫能夠慢慢「進階」，比較不容易因為一再重複失去動力。\n        要擺脫「新年新希望總是失敗」的魔咒，關鍵是將目標實踐視為一個「系統工程」，而非意志力考驗。\n        因此，在回顧過往一年的遺憾與成就時，不如問自己兩個更實際的問題：\n        如果要繼續過得還不錯，可以維持什麼習慣？\n        如果要讓日子少點遺憾，我又可以多做點什麼？\n        運用低門檻起步、習慣堆疊與定期復盤的技巧，你就能為明年的目標規畫一套能持續、能進化的系統，讓每一個微小的改變，成為你人生的推動力。\n\n--------------------\n【資料來源】：https://www.managertoday.com.tw/columns/view/71257",

        // 冷卻時間設定：1 小時 (以毫秒計算 = 60分 * 60秒 * 1000毫秒)
        const COOLDOWN_TIME = 20 * 60 * 1000;
        let cooldownInterval = null;
        let liveTimerInterval = null; // 即時計時器變數

        // 洗牌演算法
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let db = shuffle(JSON.parse(JSON.stringify(rawDb)));
        db.forEach(article => {
            shuffle(article.q);
            article.q.forEach(question => {
                let formattedOpts = question.opts.map((optText, origIdx) => ({
                    text: optText,
                    isCorrect: origIdx === question.a
                }));
                shuffle(formattedOpts);
                question.shuffledOpts = formattedOpts;
            });
        });

        let idx = 0;
        let totalScore = 0;
        let articleStartTime = null; 
        let articleTimes = [];       

        // 檢查是否處於 1 小時冷卻期
        function checkCooldown() {
            const lastSubmitTime = localStorage.getItem('last_quiz_submit_time');
            if (lastSubmitTime) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastSubmitTime);

                if (timePassed < COOLDOWN_TIME) {
                    showCooldownScreen(COOLDOWN_TIME - timePassed);
                    return true;
                }
            }
            return false;
        }

        // 顯示倒數鎖定畫面
        function showCooldownScreen(remainingTime) {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('cooldown-screen').classList.remove('hidden');

            function updateTimer() {
                remainingTime -= 1000;
                if (remainingTime <= 0) {
                    clearInterval(cooldownInterval);
                    document.getElementById('cooldown-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                    render();
                    return;
                }
                const mins = Math.floor(remainingTime / (1000 * 60));
                const secs = Math.floor((remainingTime % (1000 * 60)) / 1000);
                document.getElementById('cd-timer-text').innerText = `剩餘時間：${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;
            }

            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        function render() {
            if (checkCooldown()) return;

            // 清除前一篇的即時計時器（若存在）
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            const data = db[idx];
            document.getElementById('display-title').innerText = data.t;
            document.getElementById('display-content').innerHTML = data.c;
            
            const list = document.getElementById('quiz-list');
            list.innerHTML = '';
            data.q.forEach((item, i) => {
                let optsHtml = '';
                item.shuffledOpts.forEach((o, oi) => {
                    optsHtml += `<label class="opt-item"><input type="radio" name="q${i}" value="${oi}"> ${o.text}</label>`;
                });
                list.innerHTML += `
                    <div class="q-block">
                        <div class="q-header">${i+1}. ${item.txt} (${item.s}分)</div>
                        ${optsHtml}
                        <div id="fb${i}" class="ans-feedback"></div>
                    </div>`;
            });

            document.getElementById('live-timer-box').classList.remove('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            
            // 重置滾動條頂部位置
            document.getElementById('quiz-scroll-area').scrollTop = 0;
            document.querySelector('.article-pane').scrollTop = 0;

            articleStartTime = new Date();

            // 啟動即時動態計時器 (每秒更新一次)
            const timerText = document.getElementById('live-timer-text');
            function updateLiveTimer() {
                const now = new Date();
                const diffSec = Math.floor((now - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                timerText.innerText = `${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;

                // 超過 3 分鐘 (180 秒) 文字會轉為綠色作為溫馨提示
                if (diffSec >= 180) {
                    timerText.style.color = '#27ae60';
                } else {
                    timerText.style.color = '#e67e22';
                }
            }

            updateLiveTimer();
            liveTimerInterval = setInterval(updateLiveTimer, 1000);
        }

        function checkAll() {
            const data = db[idx];
            let roundScore = 0;

            for(let i=0; i<data.q.length; i++) {
                if(!document.querySelector(`input[name="q${i}"]:checked`)) {
                    alert("第 " + (i+1) + " 題還沒寫喔！"); return;
                }
            }

            // 停止本篇的即時計時器
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            if (articleStartTime) {
                const articleEndTime = new Date();
                const diffSec = Math.floor((articleEndTime - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                const timeStr = `${mins > 0 ? mins + ' 分 ' : ''}${secs} 秒`;
                
                articleTimes[idx] = {
                    title: data.t,
                    time: timeStr
                };
            }

            for(let i=0; i<data.q.length; i++) {
                const userVal = parseInt(document.querySelector(`input[name="q${i}"]:checked`).value);
                const item = data.q[i];
                const selectedOpt = item.shuffledOpts[userVal];
                const correctOpt = item.shuffledOpts.find(o => o.isCorrect);
                const fb = document.getElementById('fb'+i);
                fb.style.display = "block";
                
                if(selectedOpt.isCorrect) {
                    fb.className = "ans-feedback is-correct";
                    fb.innerHTML = `<strong>✅ 答對了！</strong> ${item.fb}`;
                    roundScore += item.s;
                } else {
                    fb.className = "ans-feedback is-wrong";
                    fb.innerHTML = `<strong>❌ 答錯了！</strong> 正確答案是：${correctOpt.text}<br>${item.fb}`;
                }
                document.querySelectorAll(`input[name="q${i}"]`).forEach(el => el.disabled = true);
            }

            totalScore += roundScore;
            document.getElementById('score-val').innerText = totalScore;
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            
            if(idx === db.length - 1) document.getElementById('btn-next').innerText = "查看最後總分";
        }

        function goNext() {
            idx++;
            if(idx < db.length) {
                render();
            } else {
                // 完成全部測驗，紀錄當前時間到 localStorage 作為冷卻起點
                localStorage.setItem('last_quiz_submit_time', new Date().getTime().toString());
// ▼▼▼ 新增：只隱藏上方資訊欄裡的血量與點數，保留頭像與名稱 ▼▼▼
                document.querySelectorAll('#top-panel .stats').forEach(el => el.classList.add('hidden'));
                // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
                // 隱藏題目與文章
                document.getElementById('quiz-article-wrap').classList.add('hidden');
                document.getElementById('quiz-questions-wrap').classList.add('hidden');
                
                // 顯示結算報告與右側圖片
                document.getElementById('finish-report').classList.remove('hidden');
                document.getElementById('finish-image-wrap').classList.remove('hidden');

                document.getElementById('left-pane').classList.add('no-scroll');
                document.getElementById('right-pane').classList.add('no-scroll');

                document.getElementById('final-score').innerText = totalScore;

                let timeReportHtml = "<div style='font-weight:bold; margin-bottom:10px; color:#27ae60; font-size:1.4rem;'>⏱️ 各篇閱讀與答題耗時：</div>";
                articleTimes.forEach((item) => {
                    timeReportHtml += `<div>📄 ${item.title}：<span style="color:#e67e22; font-weight:bold;">${item.time}</span></div>`;
                });
                document.getElementById('time-report').innerHTML = timeReportHtml;
// ▼▼▼ 新增：自動取得當下時間並填入防弊欄位（兩行顯示） ▼▼▼
                const now = new Date();
                const timeString = now.toLocaleString('zh-TW', { 
                    hour12: true, 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById('submission-time').innerHTML = `R5117 提交時間：<br>${timeString}`;
                // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
            }
        }

        window.onload = render;
    </script>
