<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六下-第六單元</title>
    <style>
        /* 1. 全域樣式：背景與基礎排版 */
        body, html { margin: 0; padding: 0; font-family: "Microsoft JhengHei", Arial, sans-serif; height: 100vh; overflow: hidden; }
        
        /* 資訊欄 */
        #top-panel { 
            height: 15%; background: #ffffff; 
            display: flex; align-items: center; justify-content: space-around; 
            border-bottom: 2px solid #ddd; box-sizing: border-box; 
            padding: 0 20px;
        }
        .player-info { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #3498db; object-fit: cover; }
        .player-name { font-size: 1.8rem; font-weight: bold; color: #2c3e50; }
        .stats { font-size: 2.5rem; font-weight: bold; display: flex; align-items: center; color: #2c3e50; }
        .heart { color: #e74c3c; font-size: 2.5rem; margin: 0 2px; }

        /* 進度條 */
        #progress-wrapper { width: 100%; height: 10px; background: #e0e0e0; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(to right, #2ecc71, #27ae60); transition: width 0.4s ease; }

        /* 遊戲區域底圖 */
        #bottom-panel { 
            height: calc(85% - 10px); 
            background: url('b-6-2-bg.jpg') no-repeat center center; 
            background-size: cover; 
            display: flex; justify-content: center; align-items: center; 
        }
        /* 修改 1：移除 min-height，改用 max-height 限制白框最高度 */
.quiz-container { 
    background: rgba(255, 255, 255, 0.96); 
    padding: 30px; border-radius: 25px; text-align: center; 
    width: 90%; max-width: 800px; /* 寬度可依需求調整 */
    box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
    z-index: 10;
    
    display: flex; flex-direction: column; 
    max-height: 80vh; /* 鎖定白框最高不超過螢幕 80% */
}

/* 修改 2：讓播放階段具備自動縮放能力 */
#quiz-play-phase {
    display: flex;
    flex-direction: column;
    overflow: hidden; /* 防止內部溢出 */
}

/* 修改 3：最關鍵！讓題目區在內容多時才變捲軸，內容少時不佔空間 */
#question-text { 
    font-size: 1.4rem; color: #000000; margin-bottom: 10px; 
    
    overflow-y: auto; /* 內容過長自動出捲軸 */
    flex: 0 1 auto;   /* 關鍵：0=內容少時不撐開，1=空間不夠時縮小 */
    min-height: 0;    /* 配合 Flexbox 捲軸必須設定 */
    padding: 10px;
}

/* 額外小優化：確保圖片寬度適中，且不會被拉大 */
#question-text img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 10px auto;
}

        /* 分數輸入與題目垂直分數顯示樣式 */
        .q-text-wrapper { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; }
        .q-fraction, .display-fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 5px; font-size: 1.6rem; }
        .q-line, .display-line { border-top: 3px solid #333; width: 100%; margin: 2px 0; }
        .fraction-container { display: inline-flex; align-items: center; gap: 10px; font-size: 2.2rem; }
        .fraction-input input, .whole-number input { width: 65px; text-align: center; font-size: 1.5rem; padding: 8px; border-radius: 8px; border: 2px solid #ddd; }
        #ans-normal { font-size: 1.8rem; padding: 12px; width: 80%; text-align: center; border-radius: 10px; border: 2px solid #ddd; }

        /* 三框架反饋佈局 (Grid) */
        .feedback-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-top: 10px; }
       /* 讓回饋區的左側（題目回顧、答案對照）具備捲軸功能 */
.fb-left-top {
    background: #fdfdfd; 
    padding: 20px; 
    border-radius: 15px; 
    border: 1px solid #eee; 
    text-align: left; 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start; /* 改成從頂端開始排列 */
    box-shadow: inset 0 0 10px rgba(0,0,0,0.02); 
    color: #000000;
    
    /* 關鍵：加入捲軸限制 */
    max-height: 400px;  /* 限制高度，避免圖片把按鈕推走 */
    overflow-y: auto;   /* 必要時出現垂直捲軸 */
}

/* 確保回饋區內的圖片不會撐破框架 */
.fb-left-top img {
    max-width: 100%;
    height: auto;
}
/* 2. 你的答案文字樣式 */
#fb-user-answer {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    margin-bottom: 8px;
    font-size: 1.3rem;
}

/* 3. 正確答案文字樣式 (增加淡藍色背景塊) */
#fb-answer-reveal {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    background: #e8f4fd; /* 淡藍色背景 */
    border-radius: 8px;
    width: fit-content; /* 寬度隨內容自動調整 */
    font-size: 1.5rem;
    font-weight: bold;
    color: #2c3e50;
}

/* 4. 分隔線樣式 */
.fb-divider {
    border: 0;
    border-top: 1px dashed #ddd;
    margin: 10px 0;
}
        .fb-right-top { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .fb-bottom { grid-column: 1 / span 2; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; display: flex; justify-content: center; gap: 20px; }

        #feedback-img { height: 300px; width: auto; border-radius: 10px; }
        .hidden { display: none !important; }
        .btn { padding: 15px 35px; font-size: 1.2rem; cursor: pointer; border-radius: 12px; border: none; background: #3498db; color: white; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2980b9; transform: translateY(-2px); }

        /* 結算頁面 */
        .result-content { color: white; text-align: center; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
    </style>
</head>

        </div>

//修改啟動邏輯 (window.onload)
 window.onload = function() {
    console.log("遊戲啟動中...");
    try {
        // 直接啟動，不檢查次數
        initGame(); 
        console.log("遊戲啟動成功！");
    } catch (error) {
        console.error("啟動失敗，錯誤原因：", error);
        document.getElementById('question-text').innerText = "❌ 程式載入出錯，請檢查控制台。";
    }

        function initGame() {
            hp = 15; coins = 0; currentIndex = 0;
            updateHearts();
            updateProgressBar();
            currentQuestions = [...masterQuestionBank].sort(() => 0.5 - Math.random()).slice(0, totalQuizCount);
            renderQuestion();
        }

       function updateHearts() {
    const container = document.getElementById('hp-container');
    // 直接顯示 ❤️ × 剩餘血量，字體大小設為 1.8rem 讓數字清楚
    container.innerHTML = `<span class="heart">❤️</span> <span style="font-size:1.8rem; font-weight:bold; color:#e74c3c; margin-left:5px;">× ${hp}</span>`;
}

        function updateProgressBar() {
            document.getElementById('progress-bar').style.width = (currentIndex / totalQuizCount) * 100 + "%";
        }

        // 題目渲染：自動將題目字串轉為垂直分數
        function renderQuestion() {
            const qData = currentQuestions[currentIndex];
            let rawQ = qData.q;
            
            // 轉換帶分數
            let displayQ = rawQ.replace(/(\d+)又(\d+)\/(\d+)/g, `<span class="q-text-wrapper">$1<div class="q-fraction"><span class="q-num">$2</span><span class="q-line"></span><span class="q-den">$3</span></div></span>`);
            // 轉換純分數
            displayQ = displayQ.replace(/(\d+)\/(\d+)/g, `<div class="q-fraction"><span class="q-num">$1</span><span class="q-line"></span><span class="q-den">$2</span></div>`);

            document.getElementById('question-text').innerHTML = `【第 ${currentIndex + 1} 題】<br><span class="q-main-content">${displayQ}</span>`;
            
            const inputArea = document.getElementById('input-area');
            inputArea.innerHTML = '';

            if (qData.type === 'fraction') {
                inputArea.innerHTML = `
                    <div class="fraction-container">
                        <div class="whole-number"><input type="number" id="ans-whole" placeholder="整"></div>
                        <div class="fraction-input">
                            <input type="number" id="ans-num" placeholder="子"><div class="line"></div><input type="number" id="ans-den" placeholder="母">
                        </div>
                    </div>`;
            } else {
                inputArea.innerHTML = `<input type="text" id="ans-normal" placeholder="請輸入答案">`;
            }
        }

        function checkAnswer() {
            const qData = currentQuestions[currentIndex];
            let isCorrect = false;
            let finalAnsHTML = "";
            let userAnsHTML = ""; // 用來存放學生輸入的內容
// --- 插入防呆邏輯開始 ---
        if (qData.type === 'fraction') {
            const rawW = document.getElementById('ans-whole').value;
            const rawN = document.getElementById('ans-num').value;
            const rawD = document.getElementById('ans-den').value;
            // 如果整數、分子、分母全部都是空的，就攔截
            if (rawW === "" && rawN === "" && rawD === "") {
                alert("請輸入答案後再提交喔！");
                return;
            }
        } else {
            const rawVal = document.getElementById('ans-normal').value.trim();
            if (rawVal === "") {
                alert("請輸入答案後再提交喔！");
                return;
            }
        }
        // --- 插入防呆邏輯結束 ---


            if (qData.type === 'fraction') {
        const w = document.getElementById('ans-whole').value || "0";
        const n = document.getElementById('ans-num').value || "0";
        const d = document.getElementById('ans-den').value || "1";
        
        // 記錄學生的答案 (轉成垂直分數格式顯示)
        let wPart = (w === "0" || w === "") ? "" : w;
        if (n === "0" || n === "") {
            userAnsHTML = w || "0";
        } else {
            userAnsHTML = `${wPart}<div class="display-fraction"><span class="q-num">${n}</span><span class="display-line"></span><span class="q-den">${d}</span></div>`;
        }

        if (w == qData.a.whole && n == qData.a.num && d == qData.a.den) isCorrect = true;
        
        // 正確答案 HTML (這部分原本就有)
        if (qData.a.num == "0") {
            finalAnsHTML = qData.a.whole;
        } else {
            let cwPart = qData.a.whole == "0" ? "" : qData.a.whole;
            finalAnsHTML = `${cwPart}<div class="display-fraction"><span class="q-num">${qData.a.num}</span><span class="display-line"></span><span class="q-den">${qData.a.den}</span></div>`;
        }
    } else {
        const val = document.getElementById('ans-normal').value.trim();
        userAnsHTML = val || "(空白)";
        finalAnsHTML = qData.a;
        if (val == qData.a) isCorrect = true;
    }

    // --- 介面顯示與填入 ---
    document.getElementById('quiz-play-phase').classList.add('hidden');
    document.getElementById('feedback-area').classList.remove('hidden');

    // 填入內容
    let currentFullQ = document.querySelector('.q-main-content').innerHTML;
    document.getElementById('fb-question-review').innerHTML = `題目：${currentFullQ}`;
    
    // 顯示對照
   // --- 修改後的樣子 ---
document.getElementById('fb-user-answer').innerHTML = `你的答案：<span style="color:${isCorrect ? '#27ae60' : '#e74c3c'}">${userAnsHTML}</span>`;

// 多了這兩行：先抓圖，再顯示
let extraImg = qData.ansImg || ""; 
document.getElementById('fb-answer-reveal').innerHTML = `正確答案：${finalAnsHTML}${extraImg}`;

            const fImg = document.getElementById('feedback-img');
            const bText = document.getElementById('battle-text');

            if (isCorrect) {
                fImg.src = "b-6-2-6-1.gif";
                bText.innerText = "答對了，怪物遭到致命一擊！金幣+1！";
                bText.style.color = "#27ae60";
                coins++;
                document.getElementById('coin-val').innerText = coins;
            } else {
                fImg.src = "b-6-2-6-0.gif";
                bText.innerText = "答錯了，你遭受怪物猛烈攻擊！HP-1！";
                bText.style.color = "#e74c3c";
                hp--;
                updateHearts();
            }

            if (hp <= 0) setTimeout(() => endGame('lose'), 2500);
        }

        function nextQuestion() {
            currentIndex++;
            updateProgressBar();
            if (currentIndex >= totalQuizCount) {
                endGame('win');
            } else {
                document.getElementById('quiz-play-phase').classList.remove('hidden');
                document.getElementById('feedback-area').classList.add('hidden');
                renderQuestion();
            }
        }

 function endGame(status) {
            // 1. 隱藏遊戲主容器
            document.getElementById('game-area').classList.add('hidden');
            
            let statusTxt = document.getElementById('final-status-text');
            let bgImg = "b-stop.jpg"; // 預設背景
            let detailTxt = "請至秘書處登記獎勵點數！";    

            // 2. 根據不同狀態與血量條件給予對應的文字與背景
            if (status === 'win') { 
                // 完成 20 關（win 代表打完所有題目）
                if (hp >= 14) {
                    // 血量在 14 以上：成功打敗魔王！
                    statusTxt.innerText = "恭喜你通過考驗！打敗魔王！";
                    bgImg = "b-win.jpg";
                    coins += 5; // 如果滿血/高血量通關想額外加 5 點可以保留，不要的話刪除這行
                } else {
                    // 血量在 14 以下：雖然打完 20 關但血太少
                    statusTxt.innerText = "差一點點！被魔王殘血逃跑了，下次加油！";
                    bgImg = "b-stop.jpg";
                }
            } else if (status === 'lose') { 
                // 挑戰失敗（血量歸零）
                statusTxt.innerText = "這樣就敢來挑戰！菜就多練吧！"; 
                bgImg = "b-lose.jpg";
            } else if (status === 'stop') {
                // 中途結束（點擊「結束挑戰」按鈕）
                statusTxt.innerText = "速度太慢了，下次再來挑戰吧";
                bgImg = "b-stop.jpg";
            }
            
            // 3. 更新畫面內容
            document.getElementById('bottom-panel').style.backgroundImage = `url('${bgImg}')`;
            document.getElementById('final-coins').innerText = coins;
            
            const pTag = document.querySelector('#final-screen p');
            if (pTag) pTag.innerText = detailTxt;

            // 4. 顯示結算畫面
            document.getElementById('final-screen').classList.remove('hidden');
        }

    </script>
