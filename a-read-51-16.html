    c: "        后羿射下九個太陽之後，人間的老百姓為了感謝他，便推舉后羿做皇帝。后羿在人間做皇帝是很享福的，每天吃山珍海味，稀奇的水果，住在最華麗的宮殿裡。天氣冷了，他叫老百姓到深山裡獵來虎豹，剝下皮給他做袍子。熱了，他叫幾十個宮女替他揮扇子，一刻也不休息。過著這樣舒服的日子，實在不比在天上的時候差，可是，后羿並不滿足。\n        有一天，后羿對嫦娥說：「做凡人，最多不過活一百年。我想，像我這樣的大英雄，又是萬人之上的皇帝，竟然也會像普通人一樣的死去，真是令我生氣。」嫦娥說：「如果你盡力做一個好皇帝，將來老百姓世世代代都會紀念你，這不是比長生不老更有意義嗎？」\n        后羿說：「哼！我才不管別人怎麼說，我偏偏要長生不老。」后羿打定了主意，要找到長生不老 Method。他在城門口貼出告示，宣佈：要是誰知道長生不老的方法，就賞給他一萬兩黃金。可是，老百姓哪裡會知道長生不老的方法呢？\n        日子一天天的過去，后羿的脾氣變得很壞，他大聲的罵道：「我一天比一天老了，如果再沒有人說出長生不老的方法，我就把大家通通殺死，誰也別想活！」老百姓知道后羿發脾氣，都非常的害怕。一天，城裡突然來了一個奇怪的白鬍子老先生，他拄著柺杖走進后羿的皇宮裡，對后羿說：「我知道長生不老的方法，在很遠很遠的地方，住了一個叫做王母的神仙，她有長生不老的藥……」\n        后羿高興得從寶座上跳下來，說道：「啊！太好了，快告訴我，王母住在哪裡？」白鬍子老先生慢吞吞的說：「她住在大地西邊的崦嵫山山頂上。」后羿聽了，立刻坐上一輛馬車，飛快的出發了。西邊的崦嵫山很遠，后羿一去就是好多天。\n        嫦娥住在宮殿裡，有一天晚上，她獨自一個人走到花園裡去散步。月亮在深藍的天空，像一個大玉盤，散發出柔和又美麗的光芒。嫦娥看著月亮，心裡憂愁的想：「自從后羿做了人間的皇帝之後，每天只顧著享受，脾氣變得越來越壞。他不但不替老百姓做事，反而把老百姓當作牛馬一樣驅使。如果后羿找到仙藥，變得長生不老，那麼，百姓的苦不是受不完了嗎？」\n        這時候，后羿不眠不休的前進，終於來到了大地西邊的崦嵫山。他在山下抬頭一看，山上籠罩了紫色的濃霧，不時還有神秘的火光閃爍，看起來神秘又危險。后羿下車往山上走去。說也奇怪，他每往上爬一步，紫霧和火光就退開了，露出青色的山石。爬呀爬的，爬到了最高的山頂。后羿到處張望，山頂上光禿禿的，什麼也沒有。\n        突然，背後傳來了一陣可怕的呼嘯，后羿轉頭一望，看見一個相貌很奇怪的老太太坐在山洞裡，她長了一嘴尖牙齒，身後還拖著豹子尾巴。剛才像野獸一樣的嘯聲，原來就是老太太在大笑呢。老太太對后羿說：「哈哈，你就是射下九個太陽的大英雄后羿嗎？」后羿挺起胸膛說：「對，我就是后羿，你是誰？」「我就是你要找的王母。」老太太說：「你來的原因我全明白，你是要來向我求長生不老藥的，哈哈哈。」\n        后羿一聽她就是王母，連忙跪了下來，向她求藥。王母一揮手，三隻像青玉雕出來一樣透明發亮的青鳥，合力銜了一個葫蘆飛過來，放在王母手上。王母說：「這個葫蘆裡只有兩顆長生不老藥，一顆給你，一顆給你的妻子嫦娥。在八月十五月圓的晚上吃了，就可以長生不老。不過藥只有這兩顆，你可別弄丟了啊！」\n        后羿拿到葫蘆，高興極了。他飛快的下山，跳上馬車，趕回皇宮去，把這事告訴嫦娥。八月十五日快要到了，晚上的月亮漸漸圓起來。后羿又急又高興，等著吃長生不老藥。嫦娥卻越來越憂愁，她心想：「假如后羿長生不老，老百姓世世代代都要遭殃了，得想個辦法把仙藥偷來丟掉才行。」\n        十五日晚上，月亮快要升起來的時候，嫦娥穿了一身純白的美麗衣服，拿了銀子做的酒壺，對后羿說：「過一會兒，我們都要吃仙藥了。現在，讓我們喝酒慶祝一下吧！」后羿開心的大笑：「說得對，我要好好喝幾杯！」他不知道，嫦娥在酒壺裡灌了最厲害的烈酒，后羿才喝了三杯，就醉得睡著了。\n        嫦娥看后羿在床上睡熟了，便輕手輕腳偷走后羿藏起來的葫蘆。她把葫蘆裡的兩粒仙藥倒出來，正想找地方把它丟掉，一不小心，她碰翻了燭臺，發出「匡噹」一聲，驚醒了后羿。后羿追過來，大聲喊道：「嫦娥，妳怎麼偷我的仙藥！」\n        嫦娥看到后羿追過來，心裡一著急，就把兩粒仙藥一口吞下肚去。這時候，奇怪的事發生了。嫦娥只覺得一陣清涼的氣通到肚子裡，身體突然變得輕飄飄，軟綿綿的，站也站不穩。嫦娥兩腳離地，像一片雲煙似的飛了起來。很快的，她飛出了皇宮的窗子，越飛越高，飛向繁星萬點的夜空，向皎潔的圓月亮飛去。\n        后羿看見這情形，趕緊取來弓箭，對著天空中的嫦娥胡亂射出許多箭。后羿本來是世界上最偉大的神射手，可是自從他做了皇帝之後，變得好吃懶做，箭也射不準了。后     t: "星座故事-天秤座的傳說",
    c: "        天秤座位在處女座的東邊，春天的晚上會出現在星空中，但卻不太引人注意。\n        天秤座的天秤，是正義女神阿絲特蕾亞所擁有的兩個秤盤。阿絲特蕾亞是天神宙斯和巨人泰坦族的女神迪美斯所生的女兒。在古老的過去，當世界還是「黃金時代」時，地面是個快樂的世界，也是和平的樂園，眾神和人類一起生活在地面上。正義女神阿絲特蕾亞正是負責以天秤來區分善與惡，做公平判斷的裁判官。\n        後來，世界開始有了四季寒暖之分，人類蓋了房子，穿上衣服，開始耕種。而且有了弱肉強食和爭鬥的現象，神衹們便紛紛回到仙界。只有慈悲的阿絲特蕾亞，仍舊留在地上主持正義。\n        「阿絲特蕾亞，我們已經無能為力了，讓人類自生自滅吧！」眾神都這樣勸她，可是她卻回答：「只要水還在流，花還在開，人類就有希望！」\n        到了「銅的時代」，人類開始欺騙和使用暴力，兄弟互相殘殺，朋友反目成仇，爭執終於爆發了戰爭。阿絲特蕾亞再也無法忍受人類的惡言惡行，便悲傷失望的回到天上。\n        海神波塞頓嘲笑她說：「人類根本不懂得什麼叫和平，再怎麼費心也沒用，你還是死心吧！」\n        聽了這些話，阿絲特蕾亞非常不服氣，她激動地說：「現在人類雖然有了戰爭，有一天他們會覺悟的，畢竟和平與幸福是最可貴的！」\n        「哪一天哪？」波塞頓故意誇張的問，眾神都哄笑起來。天神宙斯趕緊打圓場說：「現在停止爭論吧！阿斯特蕾亞，你何不回去看看你母親迪美斯呢？」\n        不料阿絲特蕾亞卻平靜的說：「人類可以受辱，神卻不能受辱，我要波塞頓向我道歉！」\n        但是波塞頓卻不答應。宙斯蹙起眉頭，一個是親生女兒，一個是同胞兄弟，實在左右為難啊！\n        這時，天后赫拉想出一個主意，她說：「不如就讓雙方各自製作一件作品，做得最好的，就是勝利者，若是海神輸了，就必須向阿絲特蕾亞道歉，如果輸的是阿絲特蕾亞，就取消道歉之約。怎麼樣？」\n        於是波塞頓很有自信的走到宮殿廣場上，舉起他的巨叉，大喝了一聲，重重的擊在阿克羅波里城上方，一道清泉就湧了出來。\n        「哇！」眾神興高采烈的鼓掌，波塞頓咧開大嘴大笑起來說：「阿絲特蕾亞，妳還能造出什麼更好的東西呢？」\n        正義女神沉默著，她慢慢走到廣場上，美妙的雙手在阿克羅波里城上方揮舞了幾下，接著，一棵美妙無比的橄欖樹長出來了。閃著金光的果子，累累的掛在樹枝上，葉片泛著銀光，樹幹呈現光亮的前褐紅色。只要看它一眼，內心便充滿祥和，再沒有比這個更完美的作品了。\n        輸贏就這樣決定。宙斯與眾神一致判定阿絲特蕾亞獲勝，海神波塞頓公開的向正義女神道歉，他說：「現在我才了解，愛與和平才是世界上最值得奮鬥的東西，阿絲特蕾亞，我向你道歉。」\n        阿絲特蕾亞微笑著說：「不論人類或神衹，和平相處都是長保幸福的最好方法，我希望大家都能記得。」\n        宙斯為了紀念阿絲特蕾亞的功績，便將她的兩個天秤放在天上，成為天秤座，象徵著正義，和平與寬容。\n\n--------------------\n【資料來源】：https://angelcity.tw/world/storys.htm",

{
    t: "你不知道的行憲紀念日",
    c: "        每年十二月一到，大家是不是就開始煩惱月底聖誕節的交換禮物要準備什麼呢？12月25日除了是傳說中耶穌的誕辰日外，在台灣，其實也是《中華民國憲法》的施行紀念日喔！\n        《中華民國憲法》就像是我們國家的「最高校規」或是「終極遊戲規則」，全文分成14個章節，一共有175條規定。憲法的前半部，詳細規定了我們每一個人可以享有哪些權利。像是大家常聽到的平等權（不論男女貧富大家都是平等的）、人身自由（沒有合理原因警察不能隨便抓人）、言論自由（可以自由表達想法）、財產權，還有長大後可以投票的參政權等。後半部則是規定總統、行政院、立法院等政府機關分別有哪些權力，以及國家運作應該要遵守的基本政策。例如：國家應該要特別關懷婦女、弱勢群體與少數族群，重視生態環境保護，以及實施大家現在正在接受的「義務教育」等等。另外，除了憲法本文之外，後來補充的憲法增修條文，以及大法官歷年來做的解釋，也都和憲法本文一樣具有最高法律地位喔！\n        《中華民國憲法》是在民國35年（1946）12月25日三讀通過的，並在隔年（1947）1月1日公布，同時規定在同年的12月25日正式實施。那為什麼偏偏要選擇12月25日這一天呢？據說，這是因為當時的國民政府主席蔣介石認為，這部新憲法最大的特點，就是要落實基督教裡的核心精神：將個人的尊嚴、平等與自由，普遍地給予全國人民。所以他特別挑選了紀念耶穌誕辰的這一天，作為憲法的施行日！\n        不過，這部在聖誕節誕生的憲法，真的有順利發揮作用嗎？這在歷史上其實有一段奇妙的過程喔！雖然憲法形式上在民國36年（1947）的聖誕節正式生效，但當時因為發生了「國共內戰」，政府不到半年就頒布了《動員戡亂時期臨時條款》，把憲法的許多規定給「暫停凍結」了。這個臨時條款一用就是長達43年，直到民國80年（1991）廢止後，台灣才終於能把憲法拿出來重新整理。就像我們玩的智慧型手機或電腦遊戲一樣，時間久了、功能不夠用了，系統就必須不斷「下載更新檔」！為了適應現代社會的變化，我們的憲法後來也經過了七次的「大升級」（也就是法律上說的「修憲」）。所以，今天我們生活所依據的憲法，早就加上了許多新的附加條款，跟當年那個初版的憲法比起來，早已有了完全不同的全新面貌囉！\n        雖然憲法的內容經過了不少改變，但它最重要的精神從來沒有變過。到了今天，不管是我們每天能開心地去學校上學、在網路上自由地發表文章，還是生病時有完善的健保制度可以看醫生，背後其實都有憲法在為我們撐腰！所以，下次在12月25日開心拆聖誕禮物、吃大餐的時候，別忘了也可以順便跟家人朋友分享這個小知識——原來這一天除了是聖誕節，也是守護我們權利與自由的「憲法生日」喔！\n\n--------------------\n【資料來源】：改寫自https://www.infinity-attorneys.com/edcontent_d.php?lang=tw&tb=10&id=288",

        // 冷卻時間設定：1 小時 (以毫秒計算 = 60分 * 60秒 * 1000毫秒)
        const COOLDOWN_TIME = 20 * 60 * 1000;
        let cooldownInterval = null;
        let liveTimerInterval = null; // 即時計時器變數

        // 洗牌演算法
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let db = shuffle(JSON.parse(JSON.stringify(rawDb)));
        db.forEach(article => {
            shuffle(article.q);
            article.q.forEach(question => {
                let formattedOpts = question.opts.map((optText, origIdx) => ({
                    text: optText,
                    isCorrect: origIdx === question.a
                }));
                shuffle(formattedOpts);
                question.shuffledOpts = formattedOpts;
            });
        });

        let idx = 0;
        let totalScore = 0;
        let articleStartTime = null; 
        let articleTimes = [];       

        // 檢查是否處於 1 小時冷卻期
        function checkCooldown() {
            const lastSubmitTime = localStorage.getItem('last_quiz_submit_time');
            if (lastSubmitTime) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastSubmitTime);

                if (timePassed < COOLDOWN_TIME) {
                    showCooldownScreen(COOLDOWN_TIME - timePassed);
                    return true;
                }
            }
            return false;
        }

        // 顯示倒數鎖定畫面
        function showCooldownScreen(remainingTime) {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('cooldown-screen').classList.remove('hidden');

            function updateTimer() {
                remainingTime -= 1000;
                if (remainingTime <= 0) {
                    clearInterval(cooldownInterval);
                    document.getElementById('cooldown-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                    render();
                    return;
                }
                const mins = Math.floor(remainingTime / (1000 * 60));
                const secs = Math.floor((remainingTime % (1000 * 60)) / 1000);
                document.getElementById('cd-timer-text').innerText = `剩餘時間：${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;
            }

            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        function render() {
            if (checkCooldown()) return;

            // 清除前一篇的即時計時器（若存在）
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            const data = db[idx];
            document.getElementById('display-title').innerText = data.t;
            document.getElementById('display-content').innerHTML = data.c;
            
            const list = document.getElementById('quiz-list');
            list.innerHTML = '';
            data.q.forEach((item, i) => {
                let optsHtml = '';
                item.shuffledOpts.forEach((o, oi) => {
                    optsHtml += `<label class="opt-item"><input type="radio" name="q${i}" value="${oi}"> ${o.text}</label>`;
                });
                list.innerHTML += `
                    <div class="q-block">
                        <div class="q-header">${i+1}. ${item.txt} (${item.s}分)</div>
                        ${optsHtml}
                        <div id="fb${i}" class="ans-feedback"></div>
                    </div>`;
            });

            document.getElementById('live-timer-box').classList.remove('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            
            // 重置滾動條頂部位置
            document.getElementById('quiz-scroll-area').scrollTop = 0;
            document.querySelector('.article-pane').scrollTop = 0;

            articleStartTime = new Date();

            // 啟動即時動態計時器 (每秒更新一次)
            const timerText = document.getElementById('live-timer-text');
            function updateLiveTimer() {
                const now = new Date();
                const diffSec = Math.floor((now - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                timerText.innerText = `${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;

                // 超過 3 分鐘 (180 秒) 文字會轉為綠色作為溫馨提示
                if (diffSec >= 180) {
                    timerText.style.color = '#27ae60';
                } else {
                    timerText.style.color = '#e67e22';
                }
            }

            updateLiveTimer();
            liveTimerInterval = setInterval(updateLiveTimer, 1000);
        }

        function checkAll() {
            const data = db[idx];
            let roundScore = 0;

            for(let i=0; i<data.q.length; i++) {
                if(!document.querySelector(`input[name="q${i}"]:checked`)) {
                    alert("第 " + (i+1) + " 題還沒寫喔！"); return;
                }
            }

            // 停止本篇的即時計時器
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            if (articleStartTime) {
                const articleEndTime = new Date();
                const diffSec = Math.floor((articleEndTime - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                const timeStr = `${mins > 0 ? mins + ' 分 ' : ''}${secs} 秒`;
                
                articleTimes[idx] = {
                    title: data.t,
                    time: timeStr
                };
            }

            for(let i=0; i<data.q.length; i++) {
                const userVal = parseInt(document.querySelector(`input[name="q${i}"]:checked`).value);
                const item = data.q[i];
                const selectedOpt = item.shuffledOpts[userVal];
                const correctOpt = item.shuffledOpts.find(o => o.isCorrect);
                const fb = document.getElementById('fb'+i);
                fb.style.display = "block";
                
                if(selectedOpt.isCorrect) {
                    fb.className = "ans-feedback is-correct";
                    fb.innerHTML = `<strong>✅ 答對了！</strong> ${item.fb}`;
                    roundScore += item.s;
                } else {
                    fb.className = "ans-feedback is-wrong";
                    fb.innerHTML = `<strong>❌ 答錯了！</strong> 正確答案是：${correctOpt.text}<br>${item.fb}`;
                }
                document.querySelectorAll(`input[name="q${i}"]`).forEach(el => el.disabled = true);
            }

            totalScore += roundScore;
            document.getElementById('score-val').innerText = totalScore;
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            
            if(idx === db.length - 1) document.getElementById('btn-next').innerText = "查看最後總分";
        }

            idx++;

                localStorage.setItem('last_quiz_submit_time', new Date().getTime().toString());
// ▼▼▼ 新增：只隱藏上方資訊欄裡的血量與點數，保留頭像與名稱 ▼▼▼

                // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
                // 隱藏題目與文章
                document.getElementById('quiz-article-wrap').classList.add('hidden');
                document.getElementById('quiz-questions-wrap').classList.add('hidden');
                
                // 顯示結算報告與右側圖片
                document.getElementById('finish-report').classList.remove('hidden');
                document.getElementById('finish-image-wrap').classList.remove('hidden');

                document.getElementById('left-pane').classList.add('no-scroll');
                document.getElementById('right-pane').classList.add('no-scroll');

                document.getElementById('final-score').innerText = totalScore;

                let timeReportHtml = "<div style='font-weight:bold; margin-bottom:10px; color:#27ae60; font-size:1.4rem;'>⏱️ 各篇閱讀與答題耗時：</div>";
                articleTimes.forEach((item) => {
                    timeReportHtml += `<div>📄 ${item.title}：<span style="color:#e67e22; font-weight:bold;">${item.time}</span></div>`;
                });
                document.getElementById('time-report').innerHTML = timeReportHtml;
// ▼▼▼ 新增：自動取得當下時間並填入防弊欄位（兩行顯示） ▼▼▼
                const now = new Date();
                const timeString = now.toLocaleString('zh-TW', { 
                    hour12: true,

                document.getElementById('submission-time').innerHTML = `R5116 提交時間：<br>${timeString}`;

            }
        }

        window.onload = render;
