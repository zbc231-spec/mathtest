      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;

      background: #f0f4ff;

      padding: 10px 20px;
      border-radius: 25px;
      margin: 15px auto;
      display: inline-block;
      font-size: 18px;
      font-weight: bold;
    }

    .input-section {
      background: #f8f9ff;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      color: #333;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .input-hint {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }

    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto;
    }

    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .question-section {
      margin-top: 30px;
    }

    .progress {
      text-align: center;
      margin-bottom: 20px;
      font-size: 18px;
      color: #667eea;
      font-weight: bold;
    }

      background: #f0f4ff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

      background: #f8f9ff;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .question-text {
      font-size: 24px;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .answer-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .answer-input input {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 18px;
      width: 100px;
      text-align: center;
    }

    .fraction-input {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .fraction-input input {
      width: 80px;
    }

    .fraction-line {
      width: 100px;
      height: 2px;
      background: #333;
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .result-box.correct {
      background: #d4edda;
      border: 2px solid #28a745;
    }

    .result-box.incorrect {
      background: #f8d7da;
      border: 2px solid #dc3545;
    }

      width: 600px;
      height: 300px;
      margin: 20px auto;
      display: block;
    }

    .result-text {
      font-size: 28px;
      font-weight: bold;

    }

      text-align: left;
    }

    .solution-title {
      font-weight: bold;

      color: #856404;

      border-radius: 10px;
      margin-bottom: 20px;

      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function seededRandom(seed) {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    function getDailyQuestions(dateStr) {
      const seed = dateStr.split('-').join('') * 1;
      const shuffled = [...questions];
      
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(seed + i) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, 6);
    }

    function checkIfAlreadyTested() {
      const todayKey = getTodayDate();
      const testRecords = JSON.parse(localStorage.getItem('testRecords') || '{}');
      const studentKey = `${studentData.grade}-${studentData.class}-${studentData.number}`;
      
      if (testRecords[studentKey] === todayKey) {
        return true;
      }
      return false;
    }

    function markAsTested() {
      const todayKey = getTodayDate();
      const testRecords = JSON.parse(localStorage.getItem('testRecords') || '{}');
      const studentKey = `${studentData.grade}-${studentData.class}-${studentData.number}`;
      testRecords[studentKey] = todayKey;
      localStorage.setItem('testRecords', JSON.stringify(testRecords));
    }

    function initializePage() {
      const today = getTodayDate();
      document.getElementById('dateBadge').textContent = `🗓️ ${today}`;
      dailyQuestions = getDailyQuestions(today);
    }

    function startGame() {
      const grade = document.getElementById('gradeInput').value;
      const classNum = document.getElementById('classInput').value;
      const number = document.getElementById('numberInput').value;
      const errorMessage = document.getElementById('errorMessage');

      if (!grade || !classNum || !number) {
        errorMessage.textContent = '請填寫所有欄位!';
        errorMessage.classList.remove('hidden');
        return;
      }

      studentData = { grade, class: classNum, number };

      if (checkIfAlreadyTested()) {
        errorMessage.textContent = '你今天已經測驗過了!每位學生每天只能測驗一次。';
        errorMessage.classList.remove('hidden');
        return;
      }

      errorMessage.classList.add('hidden');
      markAsTested();

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('questionScreen').classList.remove('hidden');
      document.getElementById('studentInfoText').textContent = 
        `${grade}年級 ${classNum}班 ${number}號`;

      showQuestion();
    }

    function showQuestion() {
      const question = dailyQuestions[currentQuestionIndex];
      document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
      document.getElementById('questionText').textContent = question.text;
      
      const answerArea = document.getElementById('answerInputArea');
      answerArea.innerHTML = '';

      if (question.type === 'fraction') {
        answerArea.innerHTML = `
          <div style="display: flex; align-items: center; gap: 15px; margin-top: 20px;">
            <span style="font-size: 20px;">答案:</span>
            <input type="number" id="wholeInput" placeholder="整數" style="width: 80px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center;">
            <div class="fraction-input">
              <input type="number" id="numeratorInput" placeholder="分子" style="width: 80px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center;">
              <div class="fraction-line"></div>
              <input type="number" id="denominatorInput" placeholder="分母" style="width: 80px; padding: 8px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center;">
            </div>
          </div>
        `;
      } else {
        answerArea.innerHTML = `
          <div class="answer-input">
            <span style="font-size: 20px;">答案:</span>
            <input type="text" id="decimalInput" placeholder="請輸入答案" style="width: 150px; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center;">
          </div>
        `;
      }

      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('submitBtn').classList.remove('hidden');
      document.getElementById('nextBtn').classList.add('hidden');
    }

    function submitAnswer() {
      const question = dailyQuestions[currentQuestionIndex];
      let userAnswer = '';
      let hasInput = false;

      if (question.type === 'fraction') {
        const whole = document.getElementById('wholeInput').value.trim();
        const numerator = document.getElementById('numeratorInput').value.trim();
        const denominator = document.getElementById('denominatorInput').value.trim();
        
        if (!whole && !numerator && !denominator) {
          showInlineMessage('請填入答案後再提交!');
          return;
        }
        
        hasInput = true;
        if (whole && numerator && denominator) {
          userAnswer = `${whole} ${numerator}/${denominator}`;
        } else if (numerator && denominator) {
          userAnswer = `${numerator}/${denominator}`;
        } else if (whole) {
          userAnswer = whole;
        }
      } else {
        userAnswer = document.getElementById('decimalInput').value.trim();
        if (!userAnswer) {
          showInlineMessage('請填入答案後再提交!');
          return;
        }
        hasInput = true;
      }

      const isCorrect = userAnswer === question.answer;
      if (isCorrect) score++;

      showResult(isCorrect, question);
      document.getElementById('submitBtn').classList.add('hidden');
      
      if (currentQuestionIndex < 5) {
        document.getElementById('nextBtn').classList.remove('hidden');
      } else {
        setTimeout(() => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerHTML = '<span style="font-size: 24px;">📊</span> 公布成績';
          btn.onclick = showFinalScore;
          document.getElementById('resultBox').appendChild(btn);
        }, 100);
      }
    }

    function showInlineMessage(message) {
      const resultBox = document.getElementById('resultBox');
      resultBox.innerHTML = `
        <div style="background: #fff3cd; border: 2px solid #ffc107; color: #856404; padding: 15px; border-radius: 10px; text-align: center; font-size: 18px;">
          ${message}
        </div>
      `;
      resultBox.classList.remove('hidden');
      
      setTimeout(() => {
        resultBox.classList.add('hidden');
      }, 2000);
    }

    function showResult(isCorrect, question) {
      const resultBox = document.getElementById('resultBox');
      const resultClass = isCorrect ? 'correct' : 'incorrect';
      const resultImage = isCorrect ? 'D1.gif' : 'D0.gif';
      const resultText = isCorrect ? '得1分' : '加油';
      
      let solutionHTML = '<div class="solution"><div class="solution-title">✏️ 解題過程:</div>';
      question.solution.forEach(step => {
        solutionHTML += `<div class="solution-step">${step}</div>`;
      });
      solutionHTML += '</div>';

      resultBox.innerHTML = `
        <div class="result-box ${resultClass}">
          <img src="${resultImage}" alt="${resultText}" class="result-image" onerror="this.style.display='none'; this.alt='圖片載入失敗';">
          <div class="result-text">${resultText}</div>
          ${solutionHTML}
        </div>
      `;
      resultBox.classList.remove('hidden');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      showQuestion();
    }

    function showFinalScore() {
      document.getElementById('questionScreen').classList.add('hidden');
      document.getElementById('finalScreen').classList.remove('hidden');
      document.getElementById('finalScore').textContent = score;
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('submitBtn').addEventListener('click', submitAnswer);
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);

    window.addEventListener('DOMContentLoaded', () => {
      initializePage();
      
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            document.getElementById('pageTitle').textContent = 
              config.page_title || defaultConfig.page_title;
          },
          mapToCapabilities: (config) => ({
            recolorables: [],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (config) => new Map([
            ["page_title", config.page_title || defaultConfig.page_title]
          ])
        });
      }
    });
  </script>
