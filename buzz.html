<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>法老密碼 - 班級同步搶答看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2b1807 0%, #5c340e 50%, #1f1105 100%);
      color: #fffdf5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .card {
      background: #fffdf5;
      color: #222;
      border: 4px solid #b8860b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 1060px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .card.narrow {
      max-width: 460px;
      text-align: center;
    }

    h1 {
      color: #6e4200;
      font-size: 1.55rem;
      font-weight: 900;
    }

    p.sub {
      color: #666;
      font-size: 0.95rem;
      margin: 8px 0 18px;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      font-size: 1.15rem;
      font-weight: 900;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-blue {
      background: linear-gradient(180deg, #4da6ff 0%, #0066cc 100%);
      color: #fff;
      border: 2px solid #004080;
    }

    .btn-red {
      background: linear-gradient(180deg, #ff6666 0%, #cc0000 100%);
      color: #fff;
    }

    .btn-green {
      background: linear-gradient(180deg, #5cd65c 0%, #248f24 100%);
      color: #fff;
    }

    .btn-gold {
      background: linear-gradient(180deg, #ffd24d 0%, #d49400 100%);
      color: #3d2300;
      border: 2px solid #996600;
    }

    .btn-gray {
      background: #e6e6e6;
      color: #333;
      border: 2px solid #aaa;
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-weight: 900;
      color: #4a2e00;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .text-input {
      width: 100%;
      font-size: 1.3rem;
      font-weight: 900;
      padding: 10px 12px;
      border: 2.5px solid #8a5a00;
      border-radius: 10px;
      text-align: center;
      color: #111;
      background: #fff;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #d4ae6a;
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .info-badge {
      background: #fff0b3;
      color: #5c3a00;
      border: 2px solid #b8860b;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 1.08rem;
      font-weight: 900;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .split-layout {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      background: #fffaf0;
      border: 2px solid #e0c080;
      border-radius: 12px;
      padding: 14px;
    }

    .pane-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #6e4200;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .formula-input {
      width: 100%;
      font-size: 1.65rem;
      font-weight: 900;
      padding: 10px 12px;
      border: 3px solid #333;
      border-radius: 10px;
      text-align: center;
      background: #ffffff;
      margin-bottom: 8px;
      color: #111;
    }

    .formula-input.dup-alert {
      border-color: #cc0000;
      background: #fff0f0;
    }

    .dup-warning {
      background: #ffe6e6;
      border: 2px solid #cc0000;
      color: #990000;
      font-weight: 900;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      text-align: center;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .key-btn {
      padding: 11px 0;
      font-size: 1.25rem;
      font-weight: 900;
      border: 1px solid #999;
      border-radius: 8px;
      background: #f2f2f2;
      color: #111;
      cursor: pointer;
    }

    .key-btn:active {
      background: #d9d9d9;
    }

    .key-btn.op {
      background: #ffe699;
      border-color: #b8860b;
    }

    .key-btn.del {
      background: #ffcccc;
      border-color: #cc0000;
      color: #990000;
      font-size: 1.05rem;
    }

    .attach-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .attach-preview-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff3cc;
      border: 2px solid #b8860b;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .attach-preview-box img {
      max-height: 76px;
      max-width: 140px;
      border-radius: 6px;
      border: 1px solid #8a5a00;
      object-fit: cover;
    }

    .submitted-banner {
      background: #e6ffe6;
      border: 2px solid #248f24;
      color: #196619;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .answer-list {
      max-height: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .answer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #fff8dc;
      border: 2px solid #b8860b;
      border-radius: 10px;
      padding: 10px 14px;
      animation: popIn 0.2s ease-out;
    }

    .answer-item.rank-1 {
      background: linear-gradient(90deg, #fff0b3 0%, #ffe066 100%);
      border: 2.5px solid #cc8800;
    }

    .photo-view-btn {
      background: #fff3c4;
      color: #5c3a00;
      border: 1.5px solid #b8860b;
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s;
    }

    .photo-view-btn:hover {
      background: #ffe07d;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rank-tag {
      font-size: 1rem;
      font-weight: 900;
      background: #5c3a00;
      color: #ffe066;
      padding: 4px 10px;
      border-radius: 6px;
      margin-right: 8px;
      min-width: 74px;
      text-align: center;
    }

    .rank-1 .rank-tag {
      background: #cc0000;
      color: #fff;
    }

    .sender-tag {
      font-size: 1.05rem;
      font-weight: 900;
      color: #3d2300;
      background: #ffe9a8;
      padding: 3px 9px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .formula-text {
      font-family: "Arial Black", sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: #003399;
      flex: 1;
    }

    .time-diff {
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
      white-space: nowrap;
    }

    .item-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-box {
      background: #fffdf5;
      color: #222;
      border: 4px solid #b8860b;
      border-radius: 14px;
      padding: 22px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
    }

    .lightbox-box {
      max-width: 92vw;
      max-height: 92vh;
      background: #1f1105;
      border: 3px solid #d4ae6a;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .lightbox-caption {
      color: #ffe9a8;
      font-weight: 900;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .lightbox-box img {
      max-width: 86vw;
      max-height: 75vh;
      border-radius: 8px;
      display: block;
      margin: 0 auto 12px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <!-- 1. 進房畫面：輸入座號與組別 -->
  <div class="card narrow" id="view-entry">
    <h1>𓆣 法老密碼同步搶答</h1>
    <p class="sub">輸入座號與組別即可直接進入搶答室</p>

    <div class="form-group">
      <label class="form-label" for="entry-seat">座號</label>
      <input type="text" class="text-input" id="entry-seat" placeholder="例如：03 或 15" maxlength="10" />
    </div>

    <div class="form-group">
      <label class="form-label" for="entry-group">組別</label>
      <input type="text" class="text-input" id="entry-group" placeholder="例如：第一組 或 1組" maxlength="12" />
    </div>

    <button type="button" class="btn btn-blue" id="btn-join">進入搶答室</button>
    <p id="entry-error" style="color: #cc0000; font-weight: bold; margin-top: 10px;"></p>
  </div>

  <!-- 2. 左右雙欄畫面（教師與學生共用相同版本） -->
  <div class="card hidden" id="view-room">
    <div class="top-bar">
      <div>
        <h1>𓆣 法老密碼同步搶答</h1>
        <div id="conn-status" style="font-size:0.88rem; color:#cc6600; font-weight:bold; margin-top:2px;">● 正在連線至 Firebase 即時資料庫...</div>
      </div>

      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <div class="info-badge" id="my-identity-display">組別：--・座號：--</div>
        <button type="button" class="btn btn-red" style="width:auto;" id="btn-open-clear">🔒 清除答案</button>
      </div>
    </div>

    <div class="split-layout">
      <!-- 左邊：輸入區 -->
      <div class="pane">
        <div class="pane-title">
          <span>✍️ 算式與附件照片區</span>
        </div>

        <div id="submitted-banner" class="submitted-banner hidden">
          <span>✅ 已送出：<b id="last-sent-text"></b></span>
          <button type="button" class="btn btn-gray" style="width:auto; padding:5px 10px; font-size:0.88rem;" id="btn-reset-input">再寫一組</button>
        </div>

        <input type="text" class="formula-input" id="formula-box" placeholder="輸入算式或直接拍/選照片" readonly />

        <div id="dup-warning" class="dup-warning hidden">
          ⚠️ 右邊已有相同算式！若不想重複，可按「放棄 / 清空」改寫。
        </div>

        <div class="keypad">
          <button type="button" class="key-btn" data-key="7">7</button>
          <button type="button" class="key-btn" data-key="8">8</button>
          <button type="button" class="key-btn" data-key="9">9</button>
          <button type="button" class="key-btn op" data-key="+">+</button>
          <button type="button" class="key-btn op" data-key="-">-</button>

          <button type="button" class="key-btn" data-key="4">4</button>
          <button type="button" class="key-btn" data-key="5">5</button>
          <button type="button" class="key-btn" data-key="6">6</button>
          <button type="button" class="key-btn op" data-key="×">×</button>
          <button type="button" class="key-btn op" data-key="÷">÷</button>

          <button type="button" class="key-btn" data-key="1">1</button>
          <button type="button" class="key-btn" data-key="2">2</button>
          <button type="button" class="key-btn" data-key="3">3</button>
          <button type="button" class="key-btn op" data-key="(">(</button>
          <button type="button" class="key-btn op" data-key=")">)</button>

          <button type="button" class="key-btn" data-key="0">0</button>
          <button type="button" class="key-btn op" data-key="=">=</button>
          <button type="button" class="key-btn del" id="btn-backspace">⌫ 倒退</button>
          <button type="button" class="key-btn del" style="grid-column: span 2;" id="btn-giveup">放棄 / 清空</button>
        </div>

        <!-- 附件照片選擇 -->
        <div class="attach-bar">
          <input type="file" id="photo-file-input" accept="image/*" class="hidden" />
          <button type="button" class="btn btn-gold" style="width:auto; padding:8px 14px; font-size:0.98rem;" id="btn-pick-photo">
            📷 附加照片
          </button>
          <span id="photo-status-text" style="font-size:0.88rem; color:#666; font-weight:bold;">未附加照片</span>
        </div>

        <div id="attach-preview-box" class="attach-preview-box hidden">
          <div style="display:flex; align-items:center; gap:10px;">
            <img id="attach-preview-img" alt="附件預覽" />
            <span style="font-size:0.88rem; font-weight:bold; color:#4a2e00;">已壓縮準備同步</span>
          </div>
          <button type="button" class="btn btn-gray" style="width:auto; padding:5px 10px; font-size:0.85rem;" id="btn-remove-photo">移除照片</button>
        </div>

        <button type="button" class="btn btn-green" id="btn-submit">🚀 送出算式</button>
      </div>

      <!-- 右邊：全班傳送的答案區 -->
      <div class="pane">
        <div class="pane-title">
          <span>📋 全班已送出算式</span>
          <span id="answer-count" style="font-size:0.9rem; color:#666;">共 0 筆</span>
        </div>
        <div class="answer-list" id="answer-list">
          <p style="text-align:center; color:#888; padding:40px 0; font-size:1.05rem;">目前尚無已送出的算式</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 清除答案密碼輸入框 -->
  <div class="modal-backdrop hidden" id="clear-modal">
    <div class="modal-box">
      <h2 style="color:#6e4200; font-size:1.35rem; margin-bottom:8px;">🔒 輸入清除密碼</h2>
      <p style="color:#666; font-size:0.92rem; margin-bottom:12px;">輸入正確密碼才能清空全班答案</p>
      <input type="password" class="text-input" id="clear-pwd-input" placeholder="請輸入密碼" />
      <p id="clear-pwd-error" style="color:#cc0000; font-weight:bold; font-size:0.9rem; margin-top:8px;"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-gray" id="btn-cancel-clear">取消</button>
        <button type="button" class="btn btn-red" id="btn-confirm-clear">確認清除</button>
      </div>
    </div>
  </div>

  <!-- 4. 點擊「查看照片」後放大檢視 -->
  <div class="modal-backdrop hidden" id="lightbox-modal">
    <div class="lightbox-box">
      <div id="lightbox-caption" class="lightbox-caption"></div>
      <img id="lightbox-img" alt="放大照片" />
      <button type="button" class="btn btn-gray" style="width:auto; padding:8px 22px;" id="btn-close-lightbox">關閉預覽</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // ====== Firebase 與活動設定 ======
    const FIREBASE_DATABASE_URL = "https://epgyt-code-default-rtdb.asia-southeast1.firebasedatabase.app";
    const CLEAR_PASSWORD = "995";
    const DB_ROOT = "pharaohBuzzer/room_default";
    const MAX_PHOTO_EDGE = 800; // 照片最長邊壓縮上限（px）
    const JPEG_QUALITY = 0.65;  // 壓縮品質

    const app = initializeApp({ databaseURL: FIREBASE_DATABASE_URL });
    const db = getDatabase(app);

    const roundIdRef = ref(db, `${DB_ROOT}/roundId`);
    const answersRef = ref(db, `${DB_ROOT}/answers`);
    const connectedRef = ref(db, ".info/connected");

    // ====== 狀態 ======
    let mySeat = "";
    let myGroup = "";
    let serverAnswers = [];
    let optimisticAnswers = [];
    let currentRoundId = null;
    let isClearingRound = false;
    let attachedPhotoDataUrl = "";

    // ====== DOM ======
    const connStatusEl = document.getElementById("conn-status");
    const formulaBox = document.getElementById("formula-box");
    const dupWarningEl = document.getElementById("dup-warning");
    const submittedBanner = document.getElementById("submitted-banner");
    const lastSentText = document.getElementById("last-sent-text");
    const answerListEl = document.getElementById("answer-list");
    const answerCountEl = document.getElementById("answer-count");
    const clearModal = document.getElementById("clear-modal");
    const clearPwdInput = document.getElementById("clear-pwd-input");
    const clearPwdError = document.getElementById("clear-pwd-error");
    const btnSubmit = document.getElementById("btn-submit");
    const btnConfirmClear = document.getElementById("btn-confirm-clear");
    const photoFileInput = document.getElementById("photo-file-input");
    const photoStatusText = document.getElementById("photo-status-text");
    const attachPreviewBox = document.getElementById("attach-preview-box");
    const attachPreviewImg = document.getElementById("attach-preview-img");
    const lightboxModal = document.getElementById("lightbox-modal");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");

    function getMergedSortedAnswers() {
      const merged = [...serverAnswers, ...optimisticAnswers];
      merged.sort((a, b) => (a.time || 0) - (b.time || 0));
      return merged;
    }

    function enterClassroom() {
      const seat = document.getElementById("entry-seat").value.trim();
      const group = document.getElementById("entry-group").value.trim();
      const errEl = document.getElementById("entry-error");

      if (!seat) {
        errEl.textContent = "請先輸入座號！";
        return;
      }
      if (!group) {
        errEl.textContent = "請先輸入組別！";
        return;
      }

      mySeat = seat;
      myGroup = group;
      errEl.textContent = "";

      document.getElementById("view-entry").classList.add("hidden");
      document.getElementById("view-room").classList.remove("hidden");
      document.getElementById("my-identity-display").textContent = `${myGroup}・${mySeat}號`;

      renderAnswerList();
      checkDuplicate();
    }

    function clearAttachment() {
      attachedPhotoDataUrl = "";
      photoFileInput.value = "";
      attachPreviewImg.src = "";
      attachPreviewBox.classList.add("hidden");
      photoStatusText.textContent = "未附加照片";
    }

    function resetLocalSubmittedBanner() {
      formulaBox.value = "";
      clearAttachment();
      lastSentText.textContent = "";
      submittedBanner.classList.add("hidden");
      checkDuplicate();
    }

    // 壓縮圖片至適當大小，避免單筆資料過大拖慢同步
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > MAX_PHOTO_EDGE) {
              height = Math.round((height * MAX_PHOTO_EDGE) / width);
              width = MAX_PHOTO_EDGE;
            } else if (height >= width && height > MAX_PHOTO_EDGE) {
              width = Math.round((width * MAX_PHOTO_EDGE) / height);
              height = MAX_PHOTO_EDGE;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoSelected(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      photoStatusText.textContent = "處理照片中...";
      try {
        const compressed = await compressImageFile(file);
        if (compressed.length > 1_200_000) {
          alert("照片內容較複雜，建議改拍近一點或裁切後再上傳！");
          clearAttachment();
          return;
        }
        attachedPhotoDataUrl = compressed;
        attachPreviewImg.src = compressed;
        attachPreviewBox.classList.remove("hidden");
        photoStatusText.textContent = "已附加照片";
      } catch (err) {
        alert("無法讀取照片，請換一張再試！");
        clearAttachment();
      }
    }

    async function submitFormula() {
      const formula = formulaBox.value.trim();
      if (!formula && !attachedPhotoDataUrl) {
        alert("請先輸入算式或附加照片再送出！");
        return;
      }

      const senderLabel = `${myGroup}・${mySeat}號`;
      const nowTime = Date.now();
      const tempId = `opt_${nowTime}_${Math.random().toString(36).slice(2, 7)}`;
      const photoToSend = attachedPhotoDataUrl;

      const payload = {
        sender: senderLabel,
        formula: formula || "（附件照片）",
        photo: photoToSend || "",
        time: nowTime,
        roundId: currentRoundId || "init"
      };

      // 樂觀更新：先顯示在畫面與提示條，輸入框與附件立即清空
      optimisticAnswers.push({ id: tempId, ...payload });
      lastSentText.textContent = `${senderLabel}：${payload.formula}${photoToSend ? " [含照片]" : ""}`;
      submittedBanner.classList.remove("hidden");
      formulaBox.value = "";
      clearAttachment();
      checkDuplicate();
      renderAnswerList();

      btnSubmit.disabled = true;
      btnSubmit.textContent = "⏳ 送出中...";

      try {
        await push(answersRef, payload);
        optimisticAnswers = optimisticAnswers.filter((item) => item.id !== tempId);
        renderAnswerList();
      } catch (err) {
        optimisticAnswers = optimisticAnswers.filter((item) => item.id !== tempId);
        renderAnswerList();
        alert("送出失敗，請檢查網路或照片大小後再試一次！");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "🚀 送出算式";
      }
    }

    // ==================== 密碼彈窗與清除邏輯 ====================
    function openClearModal() {
      clearPwdInput.value = "";
      clearPwdError.textContent = "";
      clearModal.classList.remove("hidden");
      clearPwdInput.focus();
    }

    function closeClearModal() {
      clearModal.classList.add("hidden");
    }

    async function verifyAndClear() {
      const inputPwd = clearPwdInput.value;
      if (inputPwd !== CLEAR_PASSWORD) {
        clearPwdError.textContent = "密碼錯誤，無法清除！";
        return;
      }

      const nextRoundId = `round_${Date.now()}`;
      btnConfirmClear.disabled = true;
      btnConfirmClear.textContent = "清除中...";
      isClearingRound = true;

      // 樂觀清空本地畫面
      optimisticAnswers = [];
      serverAnswers = [];
      currentRoundId = nextRoundId;
      renderAnswerList();
      resetLocalSubmittedBanner();
      closeClearModal();

      try {
        await set(answersRef, null);
        await set(roundIdRef, nextRoundId);
      } catch (err) {
        alert("清除同步失敗，請重試！");
      } finally {
        isClearingRound = false;
        btnConfirmClear.disabled = false;
        btnConfirmClear.textContent = "確認清除";
      }
    }

    // ==================== 比對與輸入邏輯 ====================
    function normalizeFormula(str) {
      return String(str || "")
        .replace(/\s+/g, "")
        .replace(/\*/g, "×")
        .replace(/\//g, "÷")
        .toLowerCase();
    }

    function checkDuplicate() {
      const raw = formulaBox.value.trim();
      const norm = normalizeFormula(raw);
      const list = getMergedSortedAnswers();

      if (!norm) {
        dupWarningEl.classList.add("hidden");
        formulaBox.classList.remove("dup-alert");
        return;
      }

      const isDup = list.some(
        (item) => item.formula !== "（附件照片）" && normalizeFormula(item.formula) === norm
      );
      dupWarningEl.classList.toggle("hidden", !isDup);
      formulaBox.classList.toggle("dup-alert", isDup);
    }

    function appendKey(char) {
      if (formulaBox.value.length < 25) {
        formulaBox.value += char;
        checkDuplicate();
      }
    }

    function backspaceKey() {
      formulaBox.value = formulaBox.value.slice(0, -1);
      checkDuplicate();
    }

    function giveUpFormula() {
      formulaBox.value = "";
      clearAttachment();
      checkDuplicate();
    }

    function resetInput() {
      formulaBox.value = "";
      clearAttachment();
      submittedBanner.classList.add("hidden");
      checkDuplicate();
    }

    function openLightbox(src, caption) {
      lightboxImg.src = src;
      lightboxCaption.textContent = caption;
      lightboxModal.classList.remove("hidden");
    }

    function closeLightbox() {
      lightboxModal.classList.add("hidden");
      lightboxImg.src = "";
      lightboxCaption.textContent = "";
    }

    function renderAnswerList() {
      const list = getMergedSortedAnswers();
      answerCountEl.textContent = `共 ${list.length} 筆`;

      if (list.length === 0) {
        answerListEl.innerHTML = `<p style="text-align:center; color:#888; padding:40px 0; font-size:1.05rem;">目前尚無已送出的算式</p>`;
        return;
      }

      const firstTime = list[0].time;
      answerListEl.innerHTML = list
        .map((item, idx) => {
          const diffSec = firstTime ? (((item.time || firstTime) - firstTime) / 1000).toFixed(2) : "0.00";
          const timeText = idx === 0 ? "⚡ 最快" : `+${diffSec}s`;
          const hasPhoto = typeof item.photo === "string" && item.photo.startsWith("data:image/");

          return `
            <div class="answer-item ${idx === 0 ? "rank-1" : ""}" data-idx="${idx}">
              <div style="display:flex; align-items:center; flex:1; flex-wrap:wrap; gap:4px;">
                <span class="rank-tag">第 ${idx + 1} 順位</span>
                <span class="sender-tag">${escapeHtml(item.sender)}</span>
                <span class="formula-text">${escapeHtml(item.formula)}</span>
              </div>
              <div class="item-right-group">
                ${hasPhoto ? `<button type="button" class="photo-view-btn" data-photo-idx="${idx}">🖼️ 查看照片</button>` : ""}
                <span class="time-diff">${timeText}</span>
              </div>
            </div>
          `;
        })
        .join("");

      answerListEl.querySelectorAll(".photo-view-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const itemIdx = Number(btn.getAttribute("data-photo-idx"));
          const target = list[itemIdx];
          if (target && target.photo) {
            openLightbox(target.photo, `第 ${itemIdx + 1} 順位・${target.sender}（${target.formula}）`);
          }
        });
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // ====== 綁定事件 ======
    document.getElementById("btn-join").addEventListener("click", enterClassroom);
    document.getElementById("btn-open-clear").addEventListener("click", openClearModal);
    document.getElementById("btn-cancel-clear").addEventListener("click", closeClearModal);
    btnConfirmClear.addEventListener("click", verifyAndClear);
    btnSubmit.addEventListener("click", submitFormula);
    document.getElementById("btn-backspace").addEventListener("click", backspaceKey);
    document.getElementById("btn-giveup").addEventListener("click", giveUpFormula);
    document.getElementById("btn-reset-input").addEventListener("click", resetInput);
    document.getElementById("btn-pick-photo").addEventListener("click", () => photoFileInput.click());
    document.getElementById("btn-remove-photo").addEventListener("click", clearAttachment);
    document.getElementById("btn-close-lightbox").addEventListener("click", closeLightbox);

    lightboxModal.addEventListener("click", (e) => {
      if (e.target === lightboxModal) {
        closeLightbox();
      }
    });

    photoFileInput.addEventListener("change", handlePhotoSelected);

    document.querySelectorAll(".key-btn[data-key]").forEach((btn) => {
      btn.addEventListener("click", () => appendKey(btn.getAttribute("data-key")));
    });

    clearPwdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        verifyAndClear();
      }
    });

    // ====== Firebase 即時監聽 ======
    onValue(connectedRef, (snap) => {
      const online = Boolean(snap.val());
      if (online) {
        connStatusEl.textContent = "● 已連線（與 Firebase 即時同步中）";
        connStatusEl.style.color = "#248f24";
      } else {
        connStatusEl.textContent = "⚠️ 連線重試中...";
        connStatusEl.style.color = "#cc6600";
      }
    });

    onValue(roundIdRef, (snap) => {
      const nextRound = snap.val();
      if (!nextRound) return;

      if (currentRoundId !== null && nextRound !== currentRoundId && !isClearingRound) {
        optimisticAnswers = [];
        resetLocalSubmittedBanner();
      }
      currentRoundId = nextRound;
    });

    onValue(answersRef, (snap) => {
      const raw = snap.val();
      if (!raw) {
        serverAnswers = [];
      } else {
        serverAnswers = Object.entries(raw).map(([key, val]) => ({
          id: key,
          sender: val.sender || "",
          formula: val.formula || "",
          photo: val.photo || "",
          time: Number(val.time) || 0,
          roundId: val.roundId || ""
        }));
      }
      serverAnswers.sort((a, b) => (a.time || 0) - (b.time || 0));
      renderAnswerList();
      checkDuplicate();
    });
  </script>
</body>
</html>
