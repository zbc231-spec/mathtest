<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敬請期待</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止出現捲動條 */
            background-color: #000; /* 圖片載入前的底色 */
        }

        .background {
            width: 100vw;
            height: 100vh;
            background-image: url('wait.jpg');
            background-size: cover;    /* 讓圖片填滿整個畫面 */
            background-position: center; /* 圖片置中 */
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>

    <div class="background"></div>

</body>
</html>
