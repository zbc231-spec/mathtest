<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>冒險世界大地圖</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        /* 請確保 b-map.jpg 與此檔案在同一資料夾 */
        background: url("b-map.jpg") no-repeat center center fixed;
        background-size: cover;
        font-family: "Microsoft JhengHei", sans-serif;
        overflow: hidden;
    }

    /* 四個島嶼的網格容器 */
    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        height: 100vh;
        position: relative;
        z-index: 1;
    }

    .area {
        position: relative;
        cursor: pointer;
    }

    /* 中央宮殿（智識之域）點擊區 */
    .center-palace {
        position: absolute;
        top: 60%;
        left: 55%;
        transform: translate(-50%, -50%);
        width: 220px; /* 增加感應範圍 */
        height: 220px;
        z-index: 10; /* 確保在最上層 */
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    /* 基礎文字樣式 */
    .label {
        position: absolute;
        top: 50%;
        left: 45%;
        color: white;
        font-size: 26px;
        font-weight: bold;
        text-align: center;
        opacity: 1;
        pointer-events: none;
        line-height: 1.4;
        /* 綁定呼吸動畫 */
        animation: breathing 4s ease-in-out infinite;
    }

    /* 中央智識之域文字專屬樣式 */
    .center-palace .label {
        position: relative;
        top: auto;
        left: auto;
        transform: none; /* 由父層 center-palace 控制置中 */
        font-size: 28px;
        color: #fff;
        /* 金色發光效果 */
        text-shadow: 0 0 15px #fff, 0 0 30px #ffd700, 0 0 45px #ffcc00, 2px 2px 5px #000;
    }

    /* 定義呼吸動畫效果 */
    @keyframes breathing {
        0%, 100% {
            transform: translate(-50%, -50%) scale(1);
            filter: brightness(1);
        }
        50% {
            transform: translate(-50%, -50%) scale(1.1);
            filter: brightness(1.3);
        }
    }

    /* --- 各區域專屬的文字發光效果 --- */

    /* 🌲 翠林原境 */
    .forest .label {
        text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px #00ff88, 2px 2px 5px #000;
    color: #e0fff0; /* 文字改為極淺綠，發光感更強 */
    }

    /* ☀ 烈陽沙洲 */
    .desert .label {
       text-shadow: 0 0 10px #ffcc33, 0 0 20px #ff9900, 0 0 40px #ff6600, 2px 2px 5px #000;
    color: #fff8e0;
top: 50%;   /* 往上提一點 */
    left: 60%;  /* 往右偏一點 */
    }

    /* 🔥 熔火終域 */
    .lava .label {
        text-shadow: 0 0 10px #ff3300, 0 0 20px #ff0000, 0 0 40px #aa0000, 2px 2px 5px #000;
    color: #ffe0e0;
    }

    /* 🪨 蒼岩戰境 */
    .rock .label {
        text-shadow: 0 0 10px #66ccff, 0 0 20px #3399ff, 0 0 40px #0066ff, 2px 2px 5px #000;
    color: #e0f0ff;
top: 50%;   /* 往上提一點 */
    left: 60%;  /* 往右偏一點 */
    }

    /* 平板與手機尺寸微調 */
    @media (max-width: 768px) {
        .label { font-size: 20px; }
        .center-palace .label { font-size: 24px; }
        .center-palace { width: 150px; height: 150px; }
    }
</style>
</head>

<body>

    <div class="grid">
        <div class="area forest" onclick="location.href='a-5-1-map.html'">
            <div class="label">翠林原境<br>(五上數學)</div>
        </div>

        <div class="area desert" onclick="location.href='a-5-2-map.html'">
            <div class="label">烈陽沙洲<br>(五下數學)</div>
        </div>

        <div class="area lava" onclick="location.href='a-6-2-map.html'">
            <div class="label">熔火終域<br>(六下數學)</div>
        </div>

        <div class="area rock" onclick="location.href='a-6-1-map.html'">
            <div class="label">蒼岩戰境<br>(六上數學)</div>
        </div>
    </div>

    <div class="center-palace" onclick="location.href='a-book.html'">
        <div class="label">智識之域<br>(閱讀理解)</div>
    </div>

</body>
</html>
