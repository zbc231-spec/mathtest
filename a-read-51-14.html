            border: none;
            box-shadow: none;

            width: 6px;

            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
        .article-pane::-webkit-scrollbar-track {
            background: transparent;
        }

            width: 50%;
            height: 100%;
            flex: none;
            box-sizing: border-box;
            padding: 40px 60px 40px 100px;     
            overflow-y: auto;
            border-right: none;

        .quiz-pane {
            width: 50%;
            height: 100%;
            flex: none;
            box-sizing: border-box; 
            padding: 20px 30px;          
            background: transparent;
            display: flex;
            flex-direction: column;
        }

            display: flex;

            height: 100%;
            width: 100%;

.sticky-timer-box {

}

        .hidden { display: none !important; }
    </style>

    c: "        希臘神話中的獅子座，是尼米亞的食人獅，被英雄赫丘力殺死之後，升天成為星座的。\n        赫丘力是天神宙斯與愛克美娜的兒子，天后赫拉為了報復宙斯的不忠，曾經偷偷的在赫丘力的搖籃裡放進兩隻毒蛇，結果蛇反而被年幼的他掐死了。\n        赫拉知道她無法控制宙斯的個性，為了復仇，她就想辦法讓長大之後的赫丘力發瘋，使他殺死自己的妻子和兒子。赫丘力恢復正常後，就前往杜耳拜神殿，請求神旨的安排，以彌補他的罪惡。他得到的答覆是，必須為由里斯西厄斯王服務二十年，並且完成十二件危險的任務。如果他可以完全服從國王的命令，就可以永遠不死，加入神的行列。\n        可是由里斯西厄斯受到赫拉的威脅和監督，想出了一連串艱難危險的工作。他找來赫丘力，故意裝著愁眉苦臉的樣子說：「據說尼米亞森林裡，有一隻兇猛的食人獅，牠不分晝夜的到處走動，不僅吞食家畜，連人都不放過。那兒的居民每天提心吊膽的。所以我現在命令你去殺掉那隻畜生。」\n        於是赫丘力攜帶著弓與箭筒，前往尼米亞森林搜尋食人獅。他走了好幾天才到達目的地。\n        他在森林中四處尋找，獅子卻連一絲蹤影也沒有。他也想找個人詢問，可是偌大的森林中，連隻牛羊也找不到，偶爾看到一間小屋，也早已人去屋空。\n        「看樣子，森林里的住家都被獅子嚇跑了！」\n        赫丘力卻不知道，獅子是藏在一個有雙重入口的山洞中。山洞非常隱密，除非特別注意，否則很難發覺。\n        這一天，赫丘力走到山洞附近，由於連日來的奔波使他非常疲累，便在離洞口不遠的樹叢裡睡著了。太陽逐漸西沉，赫丘力從睡夢中醒來，一抬頭，便看見從對面樹林鑽出來的食人獅。牠吃了許多活生生的動物，因此，鮮血染紅了牠厚密的毛髮，從頭部到胸前，沾濡著可怕的血跡。\n        牠慢慢踱到山洞口坐下，炯炯發光的眼睛瞪視著四周，一張血盆大口張得好大，足可吞下一個人。\n        「天啊！牠足足有一般獅子的五倍吧！」赫丘力都看呆了。他輕輕的拉好弓弦，小心翼翼的走出隱身的樹叢。\n        「咻！」箭飛快的射出，筆直的朝獅子飛去，獅子驀地站了起來，箭雖然射中牠，但是卻又像碰到石頭或鐵板般的彈了回去，掉落在地上。\n        食人獅圓睜著眼，看到了赫丘力，牠張開大嘴，大聲的吼了起來，吼聲迴蕩在整座森林，有如雷聲隆隆。\n        「可惡！這次要對準心臟了！」\n        赫丘力再次拉弓，瞄準好目標，射出了第二枝箭。箭嗖的飛出去，再度射中獅子，卻也再度被彈回來了。\n        「真糟糕！牠的皮有多堅硬啊？！」\n        當赫丘力打算射出第三枝箭時，憤怒的獅子大吼一聲，凶狠地向他撲了過來。\n        赫丘力連忙轉身就逃，一轉頭，看見不遠處長著幾棵橄欖樹，他一面躲著獅子，一面跑向橄欖樹叢，一伸手撿起一根橄欖木棍，對著迎面衝來的獅子，使出渾身力氣猛打。忽然，木棍從中折斷了，赫丘力生氣的丟掉木棍，赤手空拳的躍向這隻發狂怒吼的猛獸。\n        一場昏天暗地的格鬥，就這麼展開了。赫丘力拼命勒住食人獅的脖子，用盡所有力氣，越勒越緊。終於，食人獅的眼球凸了出來，舌頭也長長的吐出，哀叫了一聲，從此一命嗚呼了。\n        天神宙斯為了紀念赫丘力的功績，便將食人獅帶到天空，成了獅子星座，定時出現在春天的天空中。\n\n--------------------\n【資料來源】：https://angelcity.tw/world/storys.htm",

{
    t: "原民神話禁忌：山林的守護神",
    c: "        早期原住民是「大地子民」、「山林子弟」，一直扮演著山林守護神的角色，與土地及自然緊密結合，「永續經營」，約束他們的不是繁瑣法令，而是老祖宗的神話、禁忌。\n        在動物方面，原住民不獵殺小動物、季節性捕捉動物、以圖騰保護稀有動物。在魯凱族社會，獵殺小動物有損真正大男人在部落的地位，魯凱族稱這些人是「女孩子中的男人」，會被貶低族群地位。\n        原住民也會以信仰保護小動物，例如，長輩會告訴下一代，嬌小美麗的五色鳥會帶領獵人找尋獵物，是幸運的象徵，不能捕殺。不准獵殺小動物，就是要讓動物得以順利繁衍。\n        另外，原住民也會將稀有動物列為族人的「聖物」，加以保護。魯凱族與排灣族都以百步蛇和雲豹作為族群的圖騰，禁止獵殺。而台灣黑熊雖然可以獵殺，但是有古老的咒語防止「濫殺」。在魯凱族裡，黑熊肉限於特定人才能吃，小孩是一律不准吃的。獵得黑熊固然會被視為英雄，但族人也相信可能引來疾病的報應。\n        其次，像是阿美族、雅美族、排灣族等，也都嚴格的限制禁止在動物的繁殖期間捕獵，像是春天是不上山打獵、不下水撒網。\n        在植物方面，對於某些樹種，原住民會加以保護。例如榕樹生長茂密，可提供鳥類棲息，不可以砍伐，高聳的原始林有樹神保護；而木棉花是祭神用的法器之一，不可以摘，有些開發的植物也不能採。\n        在排灣族、卑南族、魯凱族的社會裡，一向不隨意採集山中的野生蘭花、野百合，因為蘭花代表聖潔；野百合只有勇士和聖潔的女孩才可佩帶，而金線蓮是「神」百步蛇的食物，除非醫療用，但也只能用多少，採多少。\n        劃定保護區的觀念也是早已出現於原住民社會。原住民利用「聖地」及「詛咒」禁止族人進入，被列為聖地的地方有水，植物生長茂密，這也是動植物繁殖的最佳環境，即使進入也不可說話，更不能攀折樹木；地形險惡的深水湖泊則是惡魔居住的地方，許多原住民都是不敢一窺究竟。\n        例如，大家最熟悉的魯凱族「小鬼湖之戀」神話，大、小鬼湖是蛇王居住的地方，視為禁地，後代子孫不能靠近，大、小鬼湖也因此不受到干擾，成為大武山上動物聚集繁殖的天堂，直到後來的登山客才揭開它們的神秘面紗。\n        而目前被劃為保護區的大武山，自古以來就被排灣族及魯凱族視為孕育子民的「聖山」——大地之母，侵犯不得。\n        原住民利用神話、禁忌保護小動物、讓動物永續繁殖、以及保護稀有動物的觀念，就是現在的保育觀；而禁止濫採植物、濫伐大樹的限制，也就是結合現在的環保和水土保持觀念，當時劃定「聖地」的大武山，也成為現今的自然生態保育區！\n        現代的保育法令條文嚴格，但許多人仍然游走法律邊緣，科技進步卻是自然和動物的殺手，早期的原住民則以無形的約束保育大自然，形同「山林守護神」，也是保育的先知。\n\n--------------------\n【資料來源】https://tw.news.yahoo.com/原民神話禁忌-守護神山林-125139951.html",

    c: " <img src='x5114-1.jpg' alt='x5114-1.jpg' style='max-width:100%; height:auto; border-radius:8px;'></div>\n        霸凌這件事，法律上分成刑事責任和民事責任兩條路，可以同時主張。在刑事責任方面，不同的霸凌行為會觸犯不同的刑法法條：毆打並造成身體傷害屬傷害罪（刑法第277條）；若拿球棒攻擊頭部等致命行為則可能構成殺人未遂罪（刑法第271條第2項）；「不從就打你」等言照威脅涉及恐嚇罪（刑法第305條）；逼對方去某個地點屬於妨害自由罪（刑法第302條）；當眾羞辱與叫罵觸犯公然侮辱罪（刑法第309條）；散布謠言與說壞話涉及誹謗罪（刑法第310條）；勒索金錢與物品則觸犯恐嚇取財罪（刑法第346條）。\n        除了刑事追訴，受害者還可以對霸凌者及其家長提起民事訴訟。依據民法第184條侵權行為，受害者可以請求醫療費用、身體傷害的財產損失，以及精神損害慰撫金（就算沒有外傷，心理創傷也能主張）。此外，依據教師法及教育基本法，學校對於學生安全負有保護義務。如果校方知情不報、刻意淡化甚至壓制學生討論，家長可以向教育局投訴、要求學校提供處理紀錄，並視情況對學校提出國家賠償申請。\n        許多家長關心未成年霸凌者是否能提告。答案是可以告，且處理方式依年齡而異：未滿12歲的孩子在刑法上沒有刑事責任能力，報案後不會被送去少年法庭，但案件會移交社政與教育系統進行輔導介入，學校端啟動輔導與懲處機制，且民事賠償仍然成立——家長必須負連帶賠償責任。12歲以上未滿18歲的霸凌者則依據《少年事件處理法》移送少年法庭由少年法官審理，可能被裁定「保護處分」（如假日生活輔導、感化教育、安置輔導等），情節嚴重者更可能被裁定移送刑事庭以成年人標準處理。依據民法規定，未成年人的法定代理人（父母）必須負連帶賠償責任，就算霸凌者本人無力賠償，受害者仍可對其父母提出民事求償。\n\n--------------------\n【資料來源】https://www.acelawyer.org/school-bully/",

        // 冷卻時間設定：1 小時 (以毫秒計算 = 60分 * 60秒 * 1000毫秒)
        const COOLDOWN_TIME = 20 * 60 * 1000;
        let cooldownInterval = null;
        let liveTimerInterval = null; // 即時計時器變數

        // 洗牌演算法
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let db = shuffle(JSON.parse(JSON.stringify(rawDb)));
        db.forEach(article => {
            shuffle(article.q);
            article.q.forEach(question => {
                let formattedOpts = question.opts.map((optText, origIdx) => ({
                    text: optText,
                    isCorrect: origIdx === question.a
                }));
                shuffle(formattedOpts);
                question.shuffledOpts = formattedOpts;
            });
        });

        let idx = 0;
        let totalScore = 0;
        let articleStartTime = null; 
        let articleTimes = [];       

        // 檢查是否處於 1 小時冷卻期
        function checkCooldown() {
            const lastSubmitTime = localStorage.getItem('last_quiz_submit_time');
            if (lastSubmitTime) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastSubmitTime);

                if (timePassed < COOLDOWN_TIME) {
                    showCooldownScreen(COOLDOWN_TIME - timePassed);
                    return true;
                }
            }
            return false;
        }

        // 顯示倒數鎖定畫面
        function showCooldownScreen(remainingTime) {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('cooldown-screen').classList.remove('hidden');

            function updateTimer() {
                remainingTime -= 1000;
                if (remainingTime <= 0) {
                    clearInterval(cooldownInterval);
                    document.getElementById('cooldown-screen').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                    render();
                    return;
                }
                const mins = Math.floor(remainingTime / (1000 * 60));
                const secs = Math.floor((remainingTime % (1000 * 60)) / 1000);
                document.getElementById('cd-timer-text').innerText = `剩餘時間：${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;
            }

            updateTimer();
            cooldownInterval = setInterval(updateTimer, 1000);
        }

        function render() {
            if (checkCooldown()) return;

            // 清除前一篇的即時計時器（若存在）
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            const data = db[idx];
            document.getElementById('display-title').innerText = data.t;
            document.getElementById('display-content').innerHTML = data.c;
            
            const list = document.getElementById('quiz-list');
            list.innerHTML = '';
            data.q.forEach((item, i) => {
                let optsHtml = '';
                item.shuffledOpts.forEach((o, oi) => {
                    optsHtml += `<label class="opt-item"><input type="radio" name="q${i}" value="${oi}"> ${o.text}</label>`;
                });
                list.innerHTML += `
                    <div class="q-block">
                        <div class="q-header">${i+1}. ${item.txt} (${item.s}分)</div>
                        ${optsHtml}
                        <div id="fb${i}" class="ans-feedback"></div>
                    </div>`;
            });

            document.getElementById('live-timer-box').classList.remove('hidden');
            document.getElementById('btn-submit').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            
            // 重置滾動條頂部位置
            document.getElementById('quiz-scroll-area').scrollTop = 0;
            document.querySelector('.article-pane').scrollTop = 0;

            articleStartTime = new Date();

            // 啟動即時動態計時器 (每秒更新一次)
            const timerText = document.getElementById('live-timer-text');
            function updateLiveTimer() {
                const now = new Date();
                const diffSec = Math.floor((now - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                timerText.innerText = `${mins} 分 ${secs < 10 ? '0' : ''}${secs} 秒`;

                // 超過 3 分鐘 (180 秒) 文字會轉為綠色作為溫馨提示
                if (diffSec >= 180) {
                    timerText.style.color = '#27ae60';
                } else {
                    timerText.style.color = '#e67e22';
                }
            }

            updateLiveTimer();
            liveTimerInterval = setInterval(updateLiveTimer, 1000);
        }

        function checkAll() {
            const data = db[idx];
            let roundScore = 0;

            for(let i=0; i<data.q.length; i++) {
                if(!document.querySelector(`input[name="q${i}"]:checked`)) {
                    alert("第 " + (i+1) + " 題還沒寫喔！"); return;
                }
            }

            // 停止本篇的即時計時器
            if (liveTimerInterval) clearInterval(liveTimerInterval);

            if (articleStartTime) {
                const articleEndTime = new Date();
                const diffSec = Math.floor((articleEndTime - articleStartTime) / 1000);
                const mins = Math.floor(diffSec / 60);
                const secs = diffSec % 60;
                const timeStr = `${mins > 0 ? mins + ' 分 ' : ''}${secs} 秒`;
                
                articleTimes[idx] = {
                    title: data.t,
                    time: timeStr
                };
            }

            for(let i=0; i<data.q.length; i++) {
                const userVal = parseInt(document.querySelector(`input[name="q${i}"]:checked`).value);
                const item = data.q[i];
                const selectedOpt = item.shuffledOpts[userVal];
                const correctOpt = item.shuffledOpts.find(o => o.isCorrect);
                const fb = document.getElementById('fb'+i);
                fb.style.display = "block";
                
                if(selectedOpt.isCorrect) {
                    fb.className = "ans-feedback is-correct";
                    fb.innerHTML = `<strong>✅ 答對了！</strong> ${item.fb}`;
                    roundScore += item.s;
                } else {
                    fb.className = "ans-feedback is-wrong";
                    fb.innerHTML = `<strong>❌ 答錯了！</strong> 正確答案是：${correctOpt.text}<br>${item.fb}`;
                }
                document.querySelectorAll(`input[name="q${i}"]`).forEach(el => el.disabled = true);
            }

            totalScore += roundScore;
            document.getElementById('score-val').innerText = totalScore;
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            
            if(idx === db.length - 1) document.getElementById('btn-next').innerText = "查看最後總分";
        }

        function goNext() {
            idx++;
            if(idx < db.length) {
                render();
            } else {
                // 完成全部測驗，紀錄當前時間到 localStorage 作為冷卻起點
                localStorage.setItem('last_quiz_submit_time', new Date().getTime().toString());
// ▼▼▼ 新增：只隱藏上方資訊欄裡的血量與點數，保留頭像與名稱 ▼▼▼
                document.querySelectorAll('#top-panel .stats').forEach(el => el.classList.add('hidden'));
                // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
                // 隱藏題目與文章
                document.getElementById('quiz-article-wrap').classList.add('hidden');
                document.getElementById('quiz-questions-wrap').classList.add('hidden');
                
                // 顯示結算報告與右側圖片
                document.getElementById('finish-report').classList.remove('hidden');
                document.getElementById('finish-image-wrap').classList.remove('hidden');

                document.getElementById('left-pane').classList.add('no-scroll');
                document.getElementById('right-pane').classList.add('no-scroll');

                document.getElementById('final-score').innerText = totalScore;

                let timeReportHtml = "<div style='font-weight:bold; margin-bottom:10px; color:#27ae60; font-size:1.4rem;'>⏱️ 各篇閱讀與答題耗時：</div>";
                articleTimes.forEach((item) => {
                    timeReportHtml += `<div>📄 ${item.title}：<span style="color:#e67e22; font-weight:bold;">${item.time}</span></div>`;
                });
                document.getElementById('time-report').innerHTML = timeReportHtml;
// ▼▼▼ 新增：自動取得當下時間並填入防弊欄位（兩行顯示） ▼▼▼
                const now = new Date();
                const timeString = now.toLocaleString('zh-TW', { 
                    hour12: true, 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                });
                document.getElementById('submission-time').innerHTML = `R5114 提交時間：<br>${timeString}`;
                // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
            }
        }

        window.onload = render;
    </script>
